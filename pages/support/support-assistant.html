<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持岗助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
        <style>
            /* CSS变量定义 */
            :root {
                --primary-color: #2563eb;
                --primary-hover: #1d4ed8;
                --secondary-color: #f3f4f6;
                --text-primary: #1F2937;
                --text-secondary: #6B7280;
                --border-color: #E5E7EB;
                --success-color: #10B981;
                --danger-color: #EF4444;
                --border-radius: 8px;
                --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                --transition: all 0.3s ease;
            }
            
            /* 左右对比布局 */
            .comparison-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin: 0 auto;
                max-width: 1200px;
                width: 100%;
                align-items: stretch;
            }
            
            /* 面板基础样式 */
            .comparison-panel {
                background: #ffffff;
                border-radius: 12px;
                padding: 15px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                flex-direction: column;
            }

            /* 空结果样式 */
            .empty-result {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 300px;
                color: var(--text-secondary);
                text-align: center;
            }

            .empty-icon {
                font-size: 48px;
                margin-bottom: 16px;
            }

            .empty-text {
                font-size: 16px;
            }

            /* 输出操作按钮组 */
            .output-actions {
                display: flex;
                gap: 10px;
            }

            .action-button.small {
                padding: 6px 12px;
                font-size: 14px;
            }

            /* 输出底部按钮 */
            .output-footer {
                margin-top: 15px;
                text-align: right;
            }
            
            /* 左侧面板 */
            .input-panel {
                min-height: 370px;
                border: 1px solid #e8e8e8;
            }
            
            /* 右侧面板 */
            .output-panel {
                min-height: 370px;
                border: 1px solid #e8e8e8;
            }
            
            /* 输入区域样式 */
            .input-section {
                margin-bottom: 15px;
            }
            
            .input-section label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: #333;
            }
            
            .input-section textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                resize: vertical;
                min-height: 100px;
                font-family: inherit;
                font-size: 14px;
                transition: var(--transition);
            }
            
            .result-actions {
                justify-content: flex-end;
                margin-top: 15px;
                padding-top: 15px;
                border-top: 1px solid var(--border-color);
            }
            
            .input-section textarea:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }
            
            /* 选项样式 */
            .option-section {
                margin-bottom: 24px;
                padding: 16px;
                background-color: var(--secondary-color);
                border-radius: var(--border-radius);
            }
            
            .option-section h4 {
                margin-bottom: 12px;
                color: var(--text-primary);
            }
            
            .option-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            
            .option-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                transition: var(--transition);
            }
            
            .option-group label:hover {
                color: var(--primary-color);
            }
            
            /* 按钮样式 */
            .action-buttons {
                display: flex;
                gap: 12px;
                margin-top: 24px;
                padding-top: 20px;
                border-top: 1px solid var(--border-color);
            }
            
            .action-button {
                padding: 12px 24px;
                border-radius: var(--border-radius);
                font-size: 16px;
                cursor: pointer;
                transition: var(--transition);
                border: none;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            
            .action-button.primary {
                background-color: var(--primary-color);
                color: white;
            }
            
            .action-button.primary:hover {
                background-color: var(--primary-hover);
                transform: translateY(-1px);
            }
            
            .action-button.secondary {
                background-color: white;
                color: var(--text-primary);
                border: 1px solid var(--border-color);
            }
            
            .action-button.secondary:hover {
                background-color: var(--secondary-color);
            }
            
            /* 结果面板样式 */
            .result-header h4 {
                color: var(--text-primary);
                margin: 0;
            }
            
            .result-content {
                flex: 1;
                padding: 12px;
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                background-color: var(--secondary-color);
                overflow-y: auto;
                margin-bottom: 15px;
                min-height: 250px;
            }
            
            .placeholder-text {
                color: var(--text-secondary);
                text-align: center;
                padding: 40px 0;
                margin: 0;
            }
            
            .result-item {
                margin-bottom: 20px;
                padding: 16px;
                background-color: var(--secondary-color);
                border-radius: var(--border-radius);
            }
            
            /* 加载动画 */
            .loading-spinner {
                border: 3px solid #f3f3f3;
                border-radius: 50%;
                border-top: 2px solid #3498db;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto;
            }
            
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            
            /* 功能标签样式 */
            .function-tabs {
                display: flex;
                margin-bottom: 20px;
                border-bottom: 1px solid #eaeaea;
            }
            
            .tab-btn {
                padding: 10px 20px;
                background: none;
                border: none;
                cursor: pointer;
                font-size: 16px;
                color: #666;
                border-bottom: 2px solid transparent;
                transition: all 0.3s ease;
            }
            
            .tab-btn:hover {
                color: var(--primary-color);
            }
            
            .tab-btn.active {
                color: var(--primary-color);
                border-bottom-color: var(--primary-color);
                font-weight: bold;
            }
            
            /* 输入区域样式 */
            .input-section input[type="text"],
            .input-section input[type="number"],
            .input-section textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            .input-section input:focus,
            .input-section textarea:focus {
                outline: none;
                border-color: #3498db;
            }
            
            /* 必填项标记 */
            .required {
                color: #e74c3c;
            }
            
            /* 按钮样式 */
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-primary {
                background-color: var(--primary-color);
                color: white;
            }
            
            .btn-primary:hover {
                background-color: var(--primary-hover);
            }
            
            /* 使用指南样式 */
            .help-section {
                background-color:#ffffff;
                border-radius: 8px;
                padding: 20px;
                margin-top: 30px;
            }
            
            .help-item {
                margin-bottom: 10px;
            }
            
            /* 成功提示组件 */
            .success-toast {
                position: fixed;
                top: 20px;
                right: 20px;
                background-color: var(--success-color);
                color: white;
                padding: 12px 20px;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                opacity: 0;
                transform: translateY(-20px);
                transition: opacity 0.3s ease, transform 0.3s ease;
                z-index: 1000;
            }
            
            .success-toast.show {
                opacity: 1;
                transform: translateY(0);
            }
        </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <!-- 成功提示组件 -->
    <div id="success-toast" class="success-toast">操作成功</div>
    
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活support角色，指定当前页面路径
        // 确保导航栏中"支持岗助手"三级类目高亮显示
        loadNavigation('../../', 'support', 'pages/support/support-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>支持岗助手</h2>
                <p>智能生成法律文书、岗位职责等支持类文档，助力企业管理效率提升</p>
            </div>
            
            <div class="page-content">
                <!-- 功能切换选项卡 -->
                <div class="function-tabs">
                    <button class="tab-btn active" onclick="switchToTab('legal-document-tab')">合同法务文书</button>
                    <button class="tab-btn" onclick="switchToTab('job-description-tab')">岗位职责JD</button>
                </div>
                
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <!-- 合同法务文书 -->
                        <div class="tab-content" id="legal-document-tab" style="display: block;">
                            <h3 class="result-header">合同法务文书内容配置输入</h3>
                            <div class="input-section">
                                <textarea id="legal-document-content" placeholder="请输入合同或法律文书的基本信息，例如合同类型、双方信息、主要条款等..." rows="3"></textarea>
                            </div>

                            <div class="input-section">
                                <label>选择参考资料</label>
                                <!-- 知识标题复选框 -->
                                <div style="margin: 15px 0;">
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>🗂️[企业知识库] </span><span>法律法规参考文档</span>
                                    </label>
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>📚[个人知识库] </span><span>合同模板与风险防范指南</span>
                                    </label>
                                </div>
                                <div class="action-buttons" style="margin-top: 10px;">
                                    <button class="action-button secondary" onclick="openModal('enterprise-knowledge-modal')">+「企业知识库」导入</button>
                                    <button class="action-button secondary" onclick="openModal('personal-knowledge-modal')">+「个人知识库」导入</button>
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <button id="generate-legal-document-btn" class="action-button primary">生成法律文书</button>
                                <button id="clear-legal-document-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                        
                        <!-- 岗位职责JD -->
                        <div class="tab-content" id="job-description-tab" style="display: none;">
                            <h3 class="result-header">岗位职责JD内容配置输入</h3>
                            <div class="input-section">
                                <textarea id="job-description-content" placeholder="请输入岗位名称、部门信息、主要职责等..." rows="3"></textarea>
                            </div>

                            <div class="input-section">
                                <label>选择参考资料</label>
                                <!-- 知识标题复选框 -->
                                <div style="margin: 15px 0;">
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>🗂️[企业知识库] </span><span>组织架构与岗位体系</span>
                                    </label>
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>📚[个人知识库] </span><span>岗位说明书编写指南</span>
                                    </label>
                                </div>
                                <div class="action-buttons" style="margin-top: 10px;">
                                    <button class="action-button secondary" onclick="openModal('enterprise-knowledge-modal')">+「企业知识库」导入</button>
                                    <button class="action-button secondary" onclick="openModal('personal-knowledge-modal')">+「个人知识库」导入</button>
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <button id="generate-job-description-btn" class="action-button primary">生成岗位职责</button>
                                <button id="clear-job-description-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧输出面板 -->
                        <div class="comparison-panel output-panel">
                            <div class="result-header">
                                <h3>生成结果</h3>
                            </div>
                            <div id="support-result" class="result-content"  style="position: relative;">
                                <div class="empty-result">
                                    <div class="empty-text">输入内容后，点击生成按钮获取结果</div>
                                    <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                        <span style="font-size: 18px;">📝</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                </div>                
            </div>

                <!-- 使用指南区域 -->
                <div class="help-section">
                    <h3>使用指南</h3>
                    <div class="help-item">
                        <strong>1. 选择功能：</strong>根据需求选择合同法务文书或岗位职责JD生成
                    </div>
                    <div class="help-item">
                        <strong>2. 填写信息：</strong>根据所选功能，填写相应的基础信息和参数
                    </div>
                    <div class="help-item">
                        <strong>3. 生成结果：</strong>点击对应按钮生成所需文档
                    </div>
                    <div class="help-item">
                        <strong>4. 应用优化：</strong>查看生成结果，可根据实际情况进行调整和完善
                    </div>
                </div>
        </main>
    </div>
    
    <!-- 功能相关的JS -->
    <script>
        // 标签页切换功能
        function switchToTab(tabId) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });
            
            // 移除所有标签按钮的active类
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示选中的标签内容
            document.getElementById(tabId).style.display = 'block';
            
            // 为选中的标签按钮添加active类
            event.target.classList.add('active');
            
            // 重置结果区域
            document.getElementById('support-result').innerHTML = `
                <div class="empty-result">
                    <div class="empty-text">输入内容后，点击生成按钮获取结果</div>
                    <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                    <span style="font-size: 18px;">📝</span>
                    </button>
                </div>
            `;
        }

        // 打开模态框函数（暂不实现具体内容）
        function openModal(modalId) {
            showSuccessToast('暂不支持此功能');
        }
        
        // 显示成功提示
        function showSuccessToast(message) {
            const toast = document.getElementById('success-toast');
            toast.textContent = message || '操作成功';
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 显示加载状态
        function showLoading(element) {
            element.innerHTML = `
                <div class="loading-spinner"></div>
                <p class="loading-text">正在生成中...</p>
            `;
        }
        
        // 合同法务文书生成功能
        document.getElementById('generate-legal-document-btn').addEventListener('click', function() {
            const inputContent = document.getElementById('legal-document-content').value.trim();
            
            if (!inputContent) {
                alert('请填写内容输入');
                return;
            }
            
            const resultElement = document.getElementById('support-result');
            showLoading(resultElement);
            
            // 模拟生成延迟
            setTimeout(() => {
                const mockLegalDoc = `# 法律文书

## 合同类型与概述
${inputContent}

## 主要条款
1. **双方信息**：
   - 甲方（当事人一）：[请填写]
   - 乙方（当事人二）：[请填写]

2. **合同标的**：
   [详细描述合同标的内容]

3. **权利义务**：
   - 甲方权利与义务
   - 乙方权利与义务

4. **违约责任**：
   - 违约情形界定
   - 违约赔偿标准
   - 争议解决方式

5. **其他条款**：
   - 合同生效条件
   - 合同期限
   - 合同变更与解除

## 法律风险提示
- 本合同模板仅供参考，建议根据实际情况进行调整
- 重大合同建议咨询专业法律顾问
- 确保合同条款符合相关法律法规要求

## 适用场景
- 企业间业务合作
- 服务外包协议
- 产品采购合同
- 劳动合同
- 保密协议`;
                
                resultElement.innerHTML = `
                    <div style="white-space: pre-wrap; font-family: inherit;">${mockLegalDoc}</div>
                    <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                        <span style="font-size: 18px;">📝</span>
                    </button>
                `;
                showSuccessToast('法律文书生成成功');
            }, 1500);
        });
        
        // 清空合同法务文书表单
        document.getElementById('clear-legal-document-btn').addEventListener('click', function() {
            document.getElementById('legal-document-content').value = '';
        });
        
        // 岗位职责JD生成功能
        document.getElementById('generate-job-description-btn').addEventListener('click', function() {
            const inputContent = document.getElementById('job-description-content').value.trim();
            
            if (!inputContent) {
                alert('请填写内容输入');
                return;
            }
            
            const resultElement = document.getElementById('support-result');
            showLoading(resultElement);
            
            // 模拟生成延迟
            setTimeout(() => {
                const mockJobDesc = `# 岗位职责说明书

## 岗位基本信息
${inputContent}

## 岗位职责
1. **核心职责**：
   - 负责[主要工作内容]
   - 制定和执行[相关工作计划]
   - 确保[工作目标]达成

2. **日常工作**：
   - 处理[日常事务]
   - 协调[跨部门合作]
   - 维护[相关关系]

3. **管理职责**（如有）：
   - 团队管理与指导
   - 绩效评估与反馈
   - 资源协调与分配

## 任职要求
1. **教育背景**：
   - [学历要求]，[专业要求]优先

2. **工作经验**：
   - [年数]年以上相关工作经验
   - 具有[特定行业/岗位]经验优先

3. **专业技能**：
   - 熟悉[相关专业知识]
   - 掌握[必备技能]
   - 具备[相关证书]优先

4. **软技能**：
   - 沟通协调能力
   - 问题解决能力
   - 团队合作精神
   - 学习创新能力

## 工作关系
- 直接上级：[上级职位]
- 直接下属：[下属职位及人数]
- 协作部门：[主要协作部门]

## 考核指标
- [关键绩效指标1]
- [关键绩效指标2]
- [关键绩效指标3]

## 福利待遇
- [薪酬范围]
- [福利政策]
- [发展机会]`;
                
                resultElement.innerHTML = `
                    <div style="white-space: pre-wrap; font-family: inherit;">${mockJobDesc}</div>
                    <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                        <span style="font-size: 18px;">📝</span>
                    </button>
                `;
                showSuccessToast('岗位职责生成成功');
            }, 1500);
        });
        
        // 清空岗位职责JD表单
        document.getElementById('clear-job-description-btn').addEventListener('click', function() {
            document.getElementById('job-description-content').value = '';
        });
    </script>
</body>
</html>
