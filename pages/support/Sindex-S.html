<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌支持小助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 品牌支持小助手页面样式 */
        .marketing-team-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 20px;
            justify-items: start;
        }
        
        .position-card {
            width: 330px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        /* 原卡片hover效果已移至position-link:hover中 */
        
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }
        
        .position-name {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            margin-top: 10px;
        }
        
        .position-description {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.6;
            padding: 10px 24px 20px 24px;

        }
        
        /* 链接样式，保持与原卡片一致 */
        .position-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .position-link:hover .position-card {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        

        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            margin: 20px;
        }
        
        .page-header h1 {
            font-size: 32px;
            color: #1831a1;
            margin-bottom: 12px;
        }
        
        .page-header p {
            font-size: 16px;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
        }
        .Mcontent {
            margin-left: 240px;
        }

        .Mpage-content {
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件
        // loadNavigation内部已经按顺序加载顶部导航和左侧导航
        const navigationPromise = new Promise((resolve) => {
            // 重写loadNavigation的then回调，在导航加载完成后显示主内容
            const originalLoadNavigation = window.loadNavigation;
            window.loadNavigation = function(basePath, activeRole) {
                originalLoadNavigation(basePath, activeRole);
                // 由于loadNavigation内部是异步加载，我们使用setTimeout确保导航加载完成
                setTimeout(() => {
                    resolve();
                }, 100);
            };
            
            // 调用修改后的loadNavigation
            window.loadNavigation('../../', 'front');
        });
        
        // 导航加载完成后显示主内容
        navigationPromise.then(() => {
            document.getElementById('main-content-container').style.display = 'block';
        });
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar">
            <!-- 左侧导航将通过JavaScript动态加载 -->
        </aside>

        <!-- 主内容区域 -->
        <main class="Mcontent" id="main-content-container" style="display: none;">           
            <div class="Mpage-content">
                <h1 style="text-align: left; color: #9a9a9a; font-size: 28px;">「支持岗」智能小助手</h1>
                <div class="marketing-team-container">
                    <!-- 助手1：合同法务文书 -->
                    <a href="contract-legal-documents.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/5jiegoufenxi.png" alt="合同法务文书" style="width:326px;height: 163px;border-radius: 8%;">
                            <h3 class="position-name">合同法务文书</h3>
                            <p class="position-description">智能撰写各类合同法务文书、合同起草、条款审核、法律意见书等，确保合规性和专业性。</p>
                        </div>
                    </a>
                    
                    <!-- 助手2：合同审核助手 -->
                    <a href="contract-review-assistant.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/1xinxitiqu.jpg" alt="合同审核助手" style="width:326px;height: 163px;border-radius: 8%;">
                            <h3 class="position-name">合同审核助手</h3>
                            <p class="position-description">快速审核合同条款，识别风险点，提供修改建议，确保合同条款合法合规，保护企业权益。</p>
                        </div>
                    </a>
                    
                    <!-- 助手3：岗位职责JD -->
                    <a href="job-description-jd.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/new02.jpg" alt="岗位职责JD" style="width:326px;height: 163px;border-radius: 8%;">
                            <h3 class="position-name">岗位职责JD</h3>
                            <p class="position-description">生成岗位职责说明书，包括岗位描述、任职要求、工作内容等，帮助企业规范岗位管理。</p>
                        </div>
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // 页面加载时设置当前用户名和处理登出功能
        document.addEventListener('DOMContentLoaded', function() {
            // 获取并显示当前用户名
            const currentUsername = localStorage.getItem('currentUsername');
            if (currentUsername) {
                document.getElementById('current-user').textContent = currentUsername;
            }
            
            // 登出功能实现
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    // 显示确认对话框
                    if (confirm('确定要退出登录吗？')) {
                        // 清除登录状态
                        localStorage.removeItem('userLoggedIn');
                        localStorage.removeItem('currentUsername');
                        
                        // 重定向到登录页
                        window.location.href = '../../login.html';
                    }
                });
            }
            
            // 为岗位卡片添加点击事件（可根据需要扩展）
            const positionCards = document.querySelectorAll('.position-card');
            positionCards.forEach(card => {
                card.addEventListener('click', function() {
                    // 这里可以添加跳转逻辑
                    console.log('点击了岗位:', this.querySelector('.position-name').textContent);
                });
            });
            
            // 确保左侧导航正确加载
            if (typeof loadSidebar === 'function') {
                loadSidebar('marketing');
            }
            
            // 确保导航停留在销售部位置且选题策划岗不展开
            setTimeout(function() {
                // 查找销售部相关的导航项（使用原生JavaScript替换:contains()选择器）
                const sidebarLinks = document.querySelectorAll('.sidebar a');
                sidebarLinks.forEach(link => {
                    if (link.getAttribute('href') && link.getAttribute('href').includes('sales') || 
                        link.textContent && link.textContent.includes('销售转化部')) {
                        link.classList.add('active');
                    }
                });
                
                // 确保选题策划岗不展开
                const sidebarLinks2 = document.querySelectorAll('.sidebar a');
                sidebarLinks2.forEach(item => {
                    // 查找包含"选题策划岗"文本的链接或href包含"topic"的链接
                    if ((item.textContent && item.textContent.includes('选题策划岗')) || 
                        (item.getAttribute('href') && item.getAttribute('href').includes('topic'))) {
                        item.classList.remove('active');
                        const parentLi = item.closest('li');
                        if (parentLi) {
                            parentLi.classList.remove('expanded', 'open');
                            const subMenu = parentLi.querySelector('.sub-menu, ul');
                            if (subMenu) {
                                subMenu.style.display = 'none';
                            }
                        }
                    }
                });
            }, 200);
        });
    </script>
</body>
</html>
