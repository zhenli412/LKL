<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉设计助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 关键样式 - 借鉴信息提取助手页面 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;

            --primary-active: #1d4ed8;
            --secondary-color: #f0f2f5;
            --border-color: #d9d9d9;
            --text-color: #333;
            --text-light: #666;
            --white: #ffffff;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --border-radius: 6px;
            --transition: all 0.3s ease;
            --error-color: #f5222d;
        }
        
        /* 对比布局容器 */
        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        /* 面板样式 */
        .comparison-panel {
            background: var(--white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        
        .input-panel {
            border: 1px solid var(--border-color);
        }
        
        .output-panel {
            border: 1px solid var(--border-color);
        }
        
        /* 标题样式 */
        h2, h4, h5 {
            color: var(--text-color);
            margin: 0;
        }
        
        h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        h3 {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        
        h4 {
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        /* 输入区域样式 */
        .input-section {
            margin-bottom: 20px;
        }
        
        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 14px;
        }
        
        /* 输入框样式 */
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            background-color: white;
            transition: var(--transition);
            box-sizing: border-box;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }
        
        /* 必填项标记 */
        .required {
            color: var(--error-color);
            font-weight: normal;
            margin-left: 4px;
        }
        
        /* Radio单选项样式 */
        input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        /* 平台选项样式 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        
        .platform-options label {
            display: flex !important;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            margin: 0 !important;
            font-weight: normal;
        }
        
        .platform-options label:hover {
            background-color: #e6f7ff;
            border-color: var(--primary-color);
        }
        
        .platform-options input[type="radio"] {
            cursor: pointer;
        }
        
        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .action-button {
            flex: 1;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        
        .action-button.primary:active:not(:disabled) {
            background-color: var(--primary-active);
        }
        
        .action-button.secondary {
            background-color: white;
            color: var(--text-light);
            border: 1px solid var(--border-color);
        }
        
        .action-button.secondary:hover:not(:disabled) {
            color: var(--secondary-color);
            border-color: var(var(--secondary-color));
        }
        
        .action-button.secondary:active:not(:disabled) {
            color: var(--secondary-active);
            border-color: var(--secondary-active);
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 标签切换样式 - 借鉴信息提取助手页面 */
        .function-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            flex-wrap: wrap;
            background-color: var(--white);
        }
        
        .tab-btn {
            padding: 12px 24px;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .tab-btn:hover {
            color: var(--primary-color);
        }
        
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: bold;
        }
        
        /* 标签内容样式 */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 文件上传区域样式 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 16px;
        }
        
        .file-upload-area:hover {
            border-color: var(--primary-color);
            background-color: #f6ffed;
        }
        
        .file-upload-area input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        
        .file-drop-text {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* 结果内容样式 */
        .result-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 20px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            min-height: 200px;
        }
        
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            margin: 60px 20px;
            font-size: 14px;
        }
        
        /* 知识库按钮样式 */
        .knowledge-base-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 4px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        
        .knowledge-base-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }
            
            .function-tabs {
                flex-wrap: wrap;
            }
            
            .tab-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
        
        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .platform-options {
                gap: 8px;
            }
            
            .platform-options label {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色
        loadNavigation('../../', 'marketing');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>视觉设计助手（二期发布 敬请期待）</h2>
                <p>智能生成视觉设计方案，包括海报、封面、配图等多种视觉内容</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    
                    <!-- 右侧结果面板 -->

                </div>
                
            </div>

            <!-- 使用指南区域 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入设计需求：</strong>在左侧输入框中填写您的设计需求和内容描述
                </div>
                <div class="help-item">
                    <strong>2. 选择设计类型：</strong>选择您需要生成的视觉设计类型（海报、封面、配图等）
                </div>
                <div class="help-item">
                    <strong>3. 设置设计风格：</strong>选择或输入您期望的设计风格和色调
                </div>
                <div class="help-item">
                    <strong>4. 生成设计方案：</strong>点击「生成设计方案」按钮获取多个设计结果
                </div>
                <div class="help-item">
                    <strong>5. 查看和保存：</strong>右侧面板将显示生成的视觉设计方案，您可以保存到个人知识库
                </div>
            </div>
        </main>
    </div>
    
    <!-- 成功提示组件 -->

</html>
