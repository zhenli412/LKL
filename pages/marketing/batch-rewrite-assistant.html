<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量二创助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            min-height: 500px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        /* 文本输入框样式 - 参考结构分析助手页面 */
        .input-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
            box-sizing: border-box;
            min-height: 120px;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .required {
        color: var(--error-color);
        font-weight: normal;
        }

        /* 声音选项样式 - 一行显示2个 */
        .voice-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .voice-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .voice-option:hover {
            border-color: var(--primary-color);
        }

        .voice-option input[type="radio"] {
            margin-right: 10px;
        }

        .voice-option span {
            flex: 1;
        }

        .play-voice-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        /* 文件上传标签样式 */
        .file-upload-label {
            display: block;
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.04);
        }

        .file-upload-label input[type="file"] {
            display: none;
        }

        .file-upload-label span {
            font-size: 24px;
        }

        .file-upload-label div:first-of-type {
            margin-top: 8px;
            font-weight: 500;
        }

        .file-upload-label div:last-of-type {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-light);
        }

        /* 场景选项样式 */
        .scene-options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .scene-option {
            cursor: pointer;
            border: 2px solid transparent;
            padding: 5px;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .scene-option:hover {
            border-color: var(--primary-color);
        }

        .scene-option input[type="radio"] {
            display: none;
        }

        .scene-option-content {
            text-align: center;
            position: relative;
        }
        
        /* 场景选中标记样式 */
        .scene-check-mark {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }
        
        .scene-check-mark::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        
        .scene-option input[type="radio"]:checked + .scene-option-content .scene-check-mark {
            opacity: 1;
        }
        
        /* 选中状态边框和背景 */
        .scene-option input[type="radio"]:checked + .scene-option-content {
            border-color: var(--success-color);
            background-color: rgba(16, 185, 129, 0.05);
        }
        

        .scene-option-image {
            background-color: #f0f0f0;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .scene-option-text {
            display: block;
            font-size: 14px;
        }

        /* 参数组样式 */
        .parameter-group {
            margin-top: 16px;
        }

        .parameter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .parameter-group select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .parameter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 话术选项样式 */
        .script-options {
            margin-bottom: 24px;
        }

        .script-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 文件上传区域样式 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: #fafafa;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .file-upload-area:hover,
        .file-upload-area.active {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.04);
        }

        .file-upload-area input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .file-upload-area:hover .upload-icon {
            opacity: 0.8;
        }

        .upload-text {
            color: var(--text-light);
            line-height: 1.5;
        }

        .upload-text div:first-child {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .upload-text div:last-child {
            font-size: 13px;
            color: var(--text-light);
        }

        /* 文件信息样式 */
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .file-name {
            color: var(--text-color);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 12px;
        }

        .remove-file {
            color: var(--primary-color);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .remove-file:hover {
            background-color: rgba(37, 99, 235, 0.1);
        }

        /* 提炼选项样式 */
        .extraction-options {
            margin-bottom: 24px;
        }

        .extraction-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .option-item label {
            font-weight: 500;
            color: var(--text-color);
            margin-right: 12px;
            min-width: 100px;
        }

        .option-item select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .option-item select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .action-button:hover {
            background-color: var(--primary-hover);
        }


        .action-button.secondary {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        .action-button.secondary:hover {
            background-color: #e5e7eb;
        }

        .action-button.small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-header h4 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .result-actions {
            display: flex;
            gap: 12px;
        }

        .result-content {
            flex: 1;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        /* 话术内容样式 */
        .script-content {
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .script-content h5 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .script-content p {
            margin-bottom: 12px;
            line-height: 1.6;
            color: var(--text-color);
        }

        /* 文本结果样式 */
        .text-result {
            color: var(--text-color);
        }

        .text-result h4 {
            margin-top: 20px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 500;
        }

        .text-result p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .input-section input[type="text"],
        .input-section input[type="number"],
        .input-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        


        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        /* 聊天对话窗口样式 */
        .chat-container {
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            padding: 16px 16px 0px 3px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            margin-bottom: 16px;
            min-height: 150px;
        }

        .chat-message {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
        }

        .chat-message.user {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }

        .chat-message.assistant {
            flex-direction: row;
            justify-content: flex-start;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin: 0 8px;
            background-color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .assistant-avatar {
            background-color: #f0f7ff;
            border: 1px solid var(--primary-color);
        }

        .user-avatar {
            background-color: var(--primary-color);
            color: white;
        }

        .chat-message-content {
            max-width: calc(100% - 8px);
            padding: 12px 16px;
            border-radius: var(--border-radius);
            word-wrap: break-word;
        }

        .chat-message.user .chat-message-content {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant .chat-message-content {
            background-color: white;
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }


        /* 调整后的聊天输入容器样式 */
        .chat-input-container {
            display: flex;
            position: relative;
            width: 100%;
            background-color: var(--white);
        }

        .chat-input {
            flex: 1;
            min-height: 60px;
            max-height: 120px;
            padding: 12px 80px 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            resize: vertical;
            font-family: inherit;
            font-size: 16px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 调整后的发送按钮样式（位于输入框内） */
        .chat-send-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 64px;
            height: 36px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-send-btn:hover {
            background-color: var(--primary-hover);
        }

        .chat-send-btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        /* 扩展按钮 - 位于输入框内左侧 */
        .chat-extend-btn {
            position: absolute;
            left: 24px;
            bottom: 24px;
            display: flex;
            gap: 4px;
        }

        .extend-btn {
            width: 36px;
            height: 36px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 16px;
        }

        .extend-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色
        loadNavigation('../../', 'marketing');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>批量二创助手</h2>
                <p>智能批量处理内容二次创作，提升内容产出效率和原创度</p>
            </div>
            <div class="page-content">
                <div class="comparison-layout">
                    <div class="comparison-panel input-panel">
                        <h3>要裂变二创文案</h3>
                        <div class="input-section">
                            <label for="original-text">输入原始文案 <span class="required">*</span></label>
                            <textarea id="original-text" placeholder="请输入需要裂变二创的原始文案..." rows="10"></textarea>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <button class="action-button secondary">+「个人知识库」导入</button>
                        </div>
                        <div class="action-buttons">
                            <button class="action-button primary">批量生成二创文案</button>
                            <button class="action-button secondary">清空</button>
                        </div>
                    </div>
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h3>批量二创结果</h3>
                        </div>
                        <div class="result-content" style="position: relative;">
                            <p class="placeholder-text">二创结果将显示在这里...</p>
                            <button class="btn btn-primary" onclick="showSuccessToast()" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                <span style="font-size: 18px;">📝</span>
                            </button>
                        </div>
                        
                        <!-- 聊天对话窗口 -->
                        <div class="chat-container">
                            <div class="chat-header">
                                <h3>对话交流</h3>
                            </div>
                            <div class="chat-messages" id="chat-messages">
                                <div class="chat-message assistant">
                                    <div class="chat-avatar assistant-avatar">Ali</div>
                                    <div class="chat-message-content">
                                        您好！我是批量二创助手。请告诉我您对生成的文案有什么具体需求或修改建议，我可以为您进一步优化。
                                    </div>
                                </div>
                            </div>
                            <div class="chat-input-container">
                                <textarea class="chat-input" id="chat-input" placeholder="请输入您的需求或问题..."></textarea>
                                <button class="chat-send-btn" id="chat-send-btn">发送</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 使用指南区域 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入原始文案：</strong>在左侧输入框中填写需要裂变二创的原始文案内容
                </div>
                <div class="help-item">
                    <strong>2. 设置生成数量：</strong>输入您需要生成的二创文案数量（1-100之间）
                </div>
                <div class="help-item">
                    <strong>3. 生成批量二创：</strong>点击「生成批量二创」按钮获取多个二创结果
                </div>
                <div class="help-item">
                    <strong>4. 查看结果：</strong>右侧面板将显示生成的所有二创文案结果
                </div>
                <div class="help-item">
                    <strong>5. 保存结果：</strong>可以将二创结果添加到个人知识库中
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // 成功提示函数
        function showSuccessToast() {
            const toast = document.createElement('div');
            toast.className = 'success-toast';
            toast.textContent = '已添加至个人知识库';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 聊天功能初始化
        function initChatFunctionality() {
            const chatInput = document.getElementById('chat-input');
            const chatSendBtn = document.getElementById('chat-send-btn');
            const chatMessages = document.getElementById('chat-messages');
            const clearChatBtn = document.getElementById('clear-chat-btn');

            // 发送消息函数
            function sendMessage() {
                const message = chatInput.value.trim();
                if (message) {
                    // 添加用户消息
                    addUserMessage(message);
                    chatInput.value = '';
                    
                    // 模拟助手回复
                    setTimeout(() => {
                        const responses = [
                            '感谢您的反馈！我已记录您的需求，正在为您生成优化方案...',
                            '明白了，我会根据您的建议对二创文案进行调整。',
                            '好的，请稍等，我正在为您优化文案内容...',
                            '您的需求很清晰，我这就为您提供更精准的二创方案。',
                            '收到，我会重点关注您提到的这些方面进行优化。'
                        ];
                        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                        addAssistantMessage(randomResponse);
                    }, 1000);
                }
            }

            // 添加用户消息
            function addUserMessage(content) {
                const messageElement = document.createElement('div');
                messageElement.className = 'chat-message user';
                
                const avatarElement = document.createElement('div');
                avatarElement.className = 'chat-avatar user-avatar';
                avatarElement.textContent = 'U';
                
                const contentElement = document.createElement('div');
                contentElement.className = 'chat-message-content';
                contentElement.textContent = escapeHtml(content);
                
                messageElement.appendChild(avatarElement);
                messageElement.appendChild(contentElement);
                chatMessages.appendChild(messageElement);
                
                // 自动滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 添加助手消息
            function addAssistantMessage(content) {
                const messageElement = document.createElement('div');
                messageElement.className = 'chat-message assistant';
                
                const avatarElement = document.createElement('div');
                avatarElement.className = 'chat-avatar assistant-avatar';
                avatarElement.textContent = 'Ali';
                
                const contentElement = document.createElement('div');
                contentElement.className = 'chat-message-content';
                contentElement.textContent = escapeHtml(content);
                
                messageElement.appendChild(avatarElement);
                messageElement.appendChild(contentElement);
                chatMessages.appendChild(messageElement);
                
                // 自动滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 清空聊天记录
            function clearChat() {
                chatMessages.innerHTML = `
                    <div class="chat-message assistant">
                        <div class="chat-avatar assistant-avatar">Ali</div>
                        <div class="chat-message-content">
                            您好！我是批量二创助手。请告诉我您对生成的文案有什么具体需求或修改建议，我可以为您进一步优化。
                        </div>
                    </div>
                `;
            }

            // 防止XSS攻击的转义函数
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 监听发送按钮点击
            chatSendBtn.addEventListener('click', sendMessage);
            
            // 监听回车键发送消息
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 监听清空按钮点击
            clearChatBtn.addEventListener('click', clearChat);
        }

        // 页面加载完成后初始化
        window.onload = function() {
            initChatFunctionality();
        };
    </script>
</body>
</html>
