<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构分析助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 - 借鉴信息提取助手 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;

            --primary-active: #096dd9;
            --secondary-color: #f0f2f5;
            --border-color: #d9d9d9;
            --text-color: #333;
            --text-light: #666;
            --white: #ffffff;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --border-radius: 6px;
            --transition: all 0.3s ease;
            --error-color: #f5222d;
        }
        
        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        /* 面板样式 - 借鉴信息提取助手 */
        .comparison-panel {
        flex: 1;
        background-color: #fff;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .input-panel {
            border: 1px solid var(--border-color);
        }
        
        .output-panel {
            border: 1px solid var(--border-color);
            min-height: 500px;
        }
        
        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 0;
            color: var(--text-color);
            font-weight: 600;
        }
        
        /* 输入区域样式 - 借鉴信息提取助手 */
        .input-section {
            margin-bottom: 24px;
        }
        
        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 14px;
        }
        
        /* 必填项标记 */
        .required {
            color: var(--error-color);
            font-weight: normal;
            margin-left: 4px;
        }
        
        /* 输入框样式 - 借鉴信息提取助手 */
        .input-section textarea,
        .input-section input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
            box-sizing: border-box;
        }
        
        .input-section textarea {
            min-height: 120px;
        }
        
        .input-section textarea:focus,
        .input-section input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        /* 文件上传区域样式 - 借鉴选题生成助手 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 16px;
            background-color: #f9fafb;
        }
        
        .file-upload-area:hover {
            border-color: var(--primary-color);
            background-color: #f6ffed;
        }
        
        .file-upload-area input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        
        .file-drop-text {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* 分析选项样式 - radio单选项样式 */
        .analysis-options {
            margin-bottom: 24px;
        }
        
        .analysis-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }
        
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: normal;
        }
        
        /* Radio单选项样式 - 借鉴信息提取助手和选题生成助手 */
        .option-group input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        /* 按钮样式 - 借鉴信息提取助手 */
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .action-button {
            flex: 1;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        
        .action-button.primary:active:not(:disabled) {
            background-color: var(--primary-active);
        }
        
        .action-button.secondary {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .action-button.secondary:hover:not(:disabled) {
            background-color: var(--secondary-color);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        
        .action-button.secondary:active:not(:disabled) {
            color: var(--primary-active);
            border-color: var(--primary-active);
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 结果区域样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 0px;
            border-bottom: 1px solid var(--border-color);        }
        
        .result-header h4 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-color);
            margin: 0;
        }
        
        /* 结果内容样式 - 借鉴选题生成助手 */
        .result-content {
            min-height: 400px;
            padding: 20px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-color);
        }
        
        .placeholder-text {
            color: var(--text-light);
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        
        /* 使用指南样式 - 严格参考选题生成助手 */
        .help-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-radius: var(--border-radius);
        }
        
        .help-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a68b3;
            margin-top: 0;
        }
        
        .help-item {
            margin-bottom: 0px;
            line-height: 1.3;
            color: #666;
        }
        
        .help-item:last-child {
            margin-bottom: 0;
        }
        
        .help-item strong {
            font-weight: 600;
            color: #333;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-button {
                width: 100%;
            }
        }
        
        .action-button {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }
        
        .action-button.primary {
            background-color: var(--primary-hover);
            color: white;
        }
        
        .action-button.primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        
        .action-button.primary:active:not(:disabled) {
            background-color: var(--primary-hover);
        }
        
        .action-button.secondary {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .action-button.secondary:hover:not(:disabled) {
            background-color: var(--secondary-color);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        
        .action-button.secondary:active:not(:disabled) {
            color: #096dd9;
            border-color: #096dd9;
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
            
            .option-group {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色，指定当前页面路径
        loadNavigation('../../', 'marketing', 'pages/marketing/structure-analysis-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>结构分析助手</h2>
                <p>智能分析文章结构，识别层次关系，助力内容规划与优化</p>
            </div>
            
            <div class="page-content">
                <!-- 功能区 -->
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <div class="result-header">
                            <h3>短视频结构、文案、风格等分析（可批量分析）</h3>
                        </div>                        
                        <!-- 1. 文本框输入 -->
                        <div class="input-section">
                            <label for="analysis-text">方式1：输入多视频文案</label>
                            <textarea id="analysis-text" placeholder="请粘贴需要分析结构的文本内容"></textarea>
                                <div style="margin-top: 15px;">
                                    <button class="action-button secondary">+「个人知识库」导入</button>
                                </div>
                        </div>
                        
                        <!-- 2. 附件输入 -->
                        <div class="input-section">
                            <label for="file-upload">方式2：上传文件</label>
                            <div class="file-upload-area">
                                <input type="file" id="file-upload" accept=".doc,.docx,.txt,.pdf">
                                <div class="file-drop-text">
                                    <span style="font-size: 32px;">📄</span><br>
                                    点击或拖拽文件到此处上传<br>
                                    支持 Word、TXT、PDF 格式
                                </div>
                            </div>
                        </div>
                        
                        
                       
                        <!-- 操作按钮 -->
                        <div class="action-buttons">
                            <button id="analyze-btn" class="action-button primary">开始分析</button>
                            <button id="clear-btn" class="action-button secondary">清空</button>
                        </div>
                    </div>

                    <!-- 右侧结果面板 -->
                        <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h3>视频结构分析结果</h3>
                        </div>
                        <div id="extraction-result" class="result-content" style="position: relative;">
                            <p class="placeholder-text">请选择功能并设置参数后，点击「开始提取」按钮</p>
                            <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                <span style="font-size: 18px;">📝</span>
                            </button>
                        </div>
                    </div>

                </div>
                
            </div>
            
            <!-- 使用指南区域 - 严格参考选题生成助手样式 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入内容：</strong>在左侧文本框中粘贴需要分析的文本内容，可以多短视频内容一并贴入输入框，或上传Word、TXT格式的文件
                </div>
                <div class="help-item">
                    <strong>2. 开始分析：</strong>点击「开始分析」按钮，系统将智能识别文本结构
                </div>
                <div class="help-item">
                    <strong>3. 查看结果：</strong>在右侧面板查看分析结果，包括文本的层级关系和结构特点
                </div>
            </div>
        </main>
    </div>
    
    <!-- 功能JavaScript已清理 -->
</body>
</html>
