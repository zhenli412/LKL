<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构分析助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 0px;
        }
        
        .comparison-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }
        
        .input-panel {
            border: 1px solid #e8e8e8;
        }
        
        .output-panel {
            border: 1px solid #e8e8e8;
            min-height: 500px;
        }
        
        .input-section {
            margin-bottom: 24px;
        }
        
        .input-section label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        .input-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .file-upload-section {
            margin-top: 12px;
            display: flex;
            gap: 12px;
        }
        
        .file-upload-section input[type="file"] {
            flex: 1;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
        }
        
        .analysis-options {
            margin-bottom: 24px;
        }
        
        .analysis-options h4 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #333;
        }
        
        .option-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .option-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
        }
        
        .option-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .result-header h4 {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            margin: 0;
        }
        
        .result-content {
            min-height: 300px;
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }
        
        .placeholder-text {
            color: #999;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        
        .loading-text {
            color: #1890ff;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        
        .result-item {
            margin-bottom: 24px;
        }
        
        .result-item h5 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #333;
        }
        
        .structure-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .structure-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .structure-list li:last-child {
            border-bottom: none;
        }
        
        .usage-guide {
            background: #fafafa;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #f0f0f0;
        }
        
        .usage-guide h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #333;
        }
        
        .usage-guide ul {
            padding-left: 20px;
            margin: 0;
            color: #666;
        }
        
        .usage-guide li {
            margin-bottom: 8px;
            line-height: 1.5;
        }
        
        .action-button {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }
        
        .action-button.primary {
            background-color: #1890ff;
            color: white;
        }
        
        .action-button.primary:hover:not(:disabled) {
            background-color: #40a9ff;
        }
        
        .action-button.primary:active:not(:disabled) {
            background-color: #096dd9;
        }
        
        .action-button.secondary {
            background-color: white;
            color: #666;
            border: 1px solid #d9d9d9;
        }
        
        .action-button.secondary:hover:not(:disabled) {
            color: #40a9ff;
            border-color: #40a9ff;
        }
        
        .action-button.secondary:active:not(:disabled) {
            color: #096dd9;
            border-color: #096dd9;
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
            
            .option-group {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色，指定当前页面路径
        loadNavigation('../../', 'marketing', 'pages/marketing/structure-analysis-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>结构分析助手</h2>
                <p>智能分析文章结构，识别层次关系，助力内容规划与优化</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <h3>文本输入与设置</h3>
                        
                        <div class="input-section">
                            <label for="structure-input">输入文本</label>
                            <textarea id="structure-input" placeholder="请在此粘贴需要分析结构的文本内容..." rows="6"></textarea>
                            
                            <div class="file-upload-section">
                                <input type="file" id="file-upload" accept=".txt,.pdf,.docx">
                                <button id="upload-btn" class="action-button secondary">上传文件</button>
                            </div>
                        </div>
                        
                        <div class="analysis-options">
                            <h4>分析选项</h4>
                            <div class="option-group">
                                <label><input type="checkbox" checked> 标题层级识别</label>
                                <label><input type="checkbox" checked> 段落关系分析</label>
                                <label><input type="checkbox"> 逻辑结构评估</label>
                                <label><input type="checkbox"> 结构优化建议</label>
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button id="analyze-btn" class="action-button primary">开始分析</button>
                            <button id="clear-btn" class="action-button secondary">清空</button>
                        </div>
                    </div>

                    <!-- 右侧结果面板 -->
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h4>分析结果</h4>
                            <button id="copy-result-btn" class="action-button secondary" disabled>复制结果</button>
                        </div>
                        <div id="structure-result" class="result-content">
                            <p class="placeholder-text">分析结果将显示在这里...</p>
                        </div>
                    </div>
                </div>
                
            </div>
            
            <!-- 使用指南区域 - 移至功能操作区下方 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入内容：</strong>粘贴文本或上传需要分析结构的文件
                </div>
                <div class="help-item">
                    <strong>2. 选择分析选项：</strong>根据需要选择标题层级识别、段落关系分析等选项
                </div>
                <div class="help-item">
                    <strong>3. 开始分析：</strong>点击「开始分析」按钮进行结构智能分析
                </div>
                <div class="help-item">
                    <strong>4. 查看结果：</strong>查看文本的层级结构和逻辑关系
                </div>
                <div class="help-item">
                    <strong>5. 复制结果：</strong>可复制分析结果用于其他用途
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 文件上传功能
            const fileUpload = document.getElementById('file-upload');
            const uploadBtn = document.getElementById('upload-btn');
            const structureInput = document.getElementById('structure-input');
            const structureResult = document.getElementById('structure-result');
            const analyzeBtn = document.getElementById('analyze-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyResultBtn = document.getElementById('copy-result-btn');
            
            // 成功提示函数
            function showSuccessToast(message) {
                // 检查是否已存在toast元素
                let toast = document.getElementById('success-toast');
                if (toast) {
                    // 如果已存在，移除旧的
                    toast.remove();
                }
                
                // 创建新的toast元素
                toast = document.createElement('div');
                toast.id = 'success-toast';
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    top: 80px;
                    left: 50%;
                    transform: translateX(-50%);
                    background-color: #52c41a;
                    color: white;
                    padding: 12px 24px;
                    border-radius: 6px;
                    box-shadow: 0 4px 12px rgba(82, 196, 26, 0.35);
                    z-index: 9999;
                    transition: opacity 0.3s ease;
                    font-size: 14px;
                    pointer-events: none;
                `;
                
                document.body.appendChild(toast);
                
                // 3秒后自动消失
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => {
                        if (document.body.contains(toast)) {
                            document.body.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }
            
            uploadBtn.addEventListener('click', function() {
                fileUpload.click();
            });
            
            fileUpload.addEventListener('change', function() {
                if (this.files.length > 0) {
                    const fileName = this.files[0].name;
                    showSuccessToast(`文件 ${fileName} 已选择，请点击开始分析按钮`);
                }
            });
            
            // 开始分析按钮事件
            analyzeBtn.addEventListener('click', function() {
                if (structureInput.value.trim() || fileUpload.files.length > 0) {
                    // 禁用分析按钮防止重复点击
                    analyzeBtn.disabled = true;
                    structureResult.innerHTML = '<p class="loading-text">正在分析结构，请稍候...</p>';
                    
                    // 模拟分析过程
                    setTimeout(() => {
                        structureResult.innerHTML = `
                            <div class="result-item">
                                <h5>文章结构分析</h5>
                                <ul class="structure-list">
                                    <li>📝 一级标题：市场调研的重要性</li>
                                    <li>  ├─ 📑 二级标题：数据分析方法</li>
                                    <li>  │   ├─ 🔍 定性分析</li>
                                    <li>  │   └─ 📊 定量分析</li>
                                    <li>  ├─ 📑 二级标题：用户访谈技巧</li>
                                    <li>  │   ├─ 💬 开放式问题设计</li>
                                    <li>  │   └─ 🎯 关键信息提取</li>
                                    <li>  └─ 📑 二级标题：报告撰写指南</li>
                                </ul>
                            </div>
                            <div class="result-item">
                                <h5>结构评估</h5>
                                <p>整体结构清晰，层级关系明确，建议补充「结论与建议」部分增强完整性。</p>
                            </div>
                        `;
                        // 启用复制按钮
                        copyResultBtn.disabled = false;
                        // 重新启用分析按钮
                        analyzeBtn.disabled = false;
                    }, 1500);
                } else {
                    showSuccessToast('请输入文本内容或上传文件');
                }
            });
            
            // 清空按钮事件
            clearBtn.addEventListener('click', function() {
                structureInput.value = '';
                fileUpload.value = '';
                structureResult.innerHTML = '<p class="placeholder-text">分析结果将显示在这里...</p>';
                // 禁用复制按钮
                copyResultBtn.disabled = true;
            });
            
            // 复制结果按钮事件
            copyResultBtn.addEventListener('click', function() {
                const resultText = structureResult.innerText;
                if (resultText !== '分析结果将显示在这里...' && resultText !== '正在分析结构，请稍候...') {
                    navigator.clipboard.writeText(resultText).then(() => {
                        showSuccessToast('结果已复制到剪贴板');
                    }).catch(() => {
                        showSuccessToast('复制失败，请手动复制');
                    });
                } else {
                    showSuccessToast('暂无结果可复制');
                }
            });
        });
    </script>
</body>
</html>
