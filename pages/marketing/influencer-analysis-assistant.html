<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>达人分析助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
            margin-bottom: 0px;
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            height: fit-content;
            min-height: 360px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .input-section input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            transition: var(--transition);
        }

        .input-section input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 平台选择样式 - 参照信息提取助手 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .platform-options label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
        }

        .platform-options input[type="radio"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 分析选项样式 */
        .analysis-options {
            margin-bottom: 24px;
        }

        .analysis-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 0;
            padding-top: 20px;
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-button:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .action-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .action-button:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
            border-color: #d1d5db;
        }
        
        .secondary-btn:active {
            transform: translateY(1px);
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-content {
            flex: 1;
            min-height: 200px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        .result-item {
            margin-bottom: 24px;
            padding: 16px;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }

        .result-item h5 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
        }

        .result-item ul {
            margin-top: 0;
            padding-left: 20px;
        }

        .result-item li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .platform-options {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色，指定当前页面路径
        loadNavigation('../../', 'marketing', 'pages/marketing/influencer-analysis-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>达人分析助手</h2>
                <p>智能分析网络达人数据，提供合作决策依据和优化建议</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <div class="result-header">
                            <h3>达人全方位分析拆解</h3>
                        </div>

                        <div class="input-section">
                            <label for="influencer-platform">选择达人平台：</label>
                            <div class="platform-options">
                                <label><input type="radio" name="influencer-platform" value="douyin" checked> 抖音</label>
                                <label><input type="radio" name="influencer-platform" value="xiaohongshu"> 小红书</label>
                                <label><input type="radio" name="influencer-platform" value="wechat"> 公众号</label>
                                <label><input type="radio" name="influencer-platform" value="bilibili"> Bilibili</label>
                                <label><input type="radio" name="influencer-platform" value="video号"> 视频号</label>
                            </div>
                        </div>
                        
                        <div class="input-section">
                            <label for="influencer-input">输入达人主页链接：</label>
                            <input type="text" id="influencer-input" placeholder="请输入要分析的达人主页链接...">
                        </div>
                        
                       
                        <!-- 操作按钮 -->
                        <div class="action-buttons">
                            <button id="analyze-btn" class="action-button">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                                </svg>
                                开始分析
                            </button>
                            <button id="clear-btn" class="action-button secondary">清空</button>
                        </div>
                    </div>
                    
                    <!-- 右侧结果面板 -->
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h3>分析结果</h3>
                        </div>
                        
                          <div id="extraction-result" class="result-content" style="position: relative;">
                            <p class="placeholder-text">请选择功能并设置参数后，点击「开始提取」按钮</p>
                            <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                <span style="font-size: 18px;">📝</span>
                            </button>
                           </div>
                    </div>
                </div>
            </div>
            
            <!-- 使用指南区域 - 移至功能操作区下方 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入达人信息：</strong>在左侧输入达人名称或ID，选择要分析的平台
                </div>
                <div class="help-item">
                    <strong>2. 选择分析维度：</strong>勾选需要分析的维度，如粉丝画像、内容风格等
                </div>
                <div class="help-item">
                    <strong>3. 开始分析：</strong>点击"开始分析"按钮获取达人数据分析结果
                </div>
                <div class="help-item">
                    <strong>4. 查看结果：</strong>分析结果将显示在右侧面板中
                </div>
                <div class="help-item">
                    <strong>5. 复制结果：</strong>可复制分析结果用于合作决策参考
                </div>
            </div>
        </main>
    </div>
    
    <!-- 成功提示组件 -->
    <div id="success-toast" class="success-toast">操作成功</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const influencerInput = document.getElementById('influencer-input');
            const analyzeBtn = document.getElementById('analyze-btn');
            const clearBtn = document.getElementById('clear-btn');
            const influencerResult = document.getElementById('influencer-result');
            const successToast = document.getElementById('success-toast');
            
            // 显示成功提示
            function showToast(message) {
                // 检查是否有正在显示的提示，如果有则先移除
                if (successToast.classList.contains('show')) {
                    successToast.classList.remove('show');
                    // 短暂延迟后再显示新的提示
                    setTimeout(() => {
                        successToast.textContent = message || '操作成功';
                        successToast.classList.add('show');
                        setTimeout(() => {
                            successToast.classList.remove('show');
                        }, 3000);
                    }, 300);
                } else {
                    successToast.textContent = message || '操作成功';
                    successToast.classList.add('show');
                    setTimeout(() => {
                        successToast.classList.remove('show');
                    }, 3000);
                }
            }
            
            // 开始分析按钮事件
            analyzeBtn.addEventListener('click', function() {
                const influencerName = influencerInput.value.trim();
                const platforms = Array.from(document.querySelectorAll('input[name="platform"]:checked')).map(el => el.value);
                const analysisOptions = Array.from(document.querySelectorAll('input[name="analysis-option"]:checked')).map(el => el.value);
                
                // 验证输入
                if (!influencerName) {
                    showToast('请输入达人名称或ID');
                    return;
                }
                
                if (platforms.length === 0) {
                    showToast('请至少选择一个平台');
                    return;
                }
                
                if (analysisOptions.length === 0) {
                    showToast('请至少选择一个分析维度');
                    return;
                }
                
                // 禁用分析按钮防止重复点击
                analyzeBtn.disabled = true;
                influencerResult.innerHTML = '<div class="loading-text"><div class="loading-spinner"></div>正在分析达人数据，请稍候...</div>';
                
                // 模拟分析过程
                setTimeout(() => {
                    let resultHTML = '';
                    
                    // 基础信息
                    resultHTML += `
                        <div class="result-item">
                            <h5>达人基本信息</h5>
                            <p><strong>分析对象：</strong>${influencerName}</p>
                            <p><strong>主要平台：</strong>${platforms.map(p => {
                                const platformMap = {douyin: '抖音', xiaohongshu: '小红书', wechat: '视频号', bilibili: 'B站', weibo: '微博'};
                                return platformMap[p] || p;
                            }).join('、')}</p>
                            <p><strong>内容领域：</strong>生活方式、美妆</p>
                        </div>
                    `;
                    
                    // 根据选择的分析维度展示不同内容
                    if (analysisOptions.includes('audience')) {
                        resultHTML += `
                            <div class="result-item">
                                <h5>粉丝画像分析</h5>
                                <ul>
                                    <li>👥 粉丝数量：约50万</li>
                                    <li>🚺 性别分布：女性85%，男性15%</li>
                                    <li>🎯 年龄分布：18-35岁占75%</li>
                                    <li>📍 地域分布：一二线城市占60%</li>
                                </ul>
                            </div>
                        `;
                    }
                    
                    if (analysisOptions.includes('content')) {
                        resultHTML += `
                            <div class="result-item">
                                <h5>内容风格分析</h5>
                                <p>以真实测评和日常分享为主，风格亲切自然，语言简洁易懂，互动性强。</p>
                            </div>
                        `;
                    }
                    
                    if (analysisOptions.includes('engagement')) {
                        resultHTML += `
                            <div class="result-item">
                                <h5>互动数据评估</h5>
                                <ul>
                                    <li>👍 平均点赞率：5.2%</li>
                                    <li>💬 平均评论数：1,200+</li>
                                    <li>📤 平均分享率：1.8%</li>
                                    <li>👁️ 平均浏览完成率：68%</li>
                                </ul>
                            </div>
                        `;
                    }
                    
                    if (analysisOptions.includes('business')) {
                        resultHTML += `
                            <div class="result-item">
                                <h5>商业价值评估</h5>
                                <ul>
                                    <li>💰 预估合作费用：5-8万/条</li>
                                    <li>📈 种草转化率：约3.5%</li>
                                    <li>⭐ 品牌匹配度：高</li>
                                    <li>🔄 内容更新频率：每周2-3条</li>
                                </ul>
                            </div>
                        `;
                    }
                    
                    // 添加合作建议
                    resultHTML += `
                        <div class="result-item">
                            <h5>合作建议</h5>
                            <p>适合美妆、时尚、生活类产品合作，建议以真实体验分享形式呈现，保持达人原有风格。</p>
                        </div>
                    `;
                    
                    influencerResult.innerHTML = resultHTML;
                    // 恢复分析按钮状态
                    analyzeBtn.disabled = false;
                    showToast('分析完成');
                }, 1500);
            });
            
            // 清空按钮事件
            clearBtn.addEventListener('click', function() {
                influencerInput.value = '';
                document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = true;
                });
                influencerResult.innerHTML = '<p class="placeholder-text">分析结果将显示在这里...</p>';
                showToast('输入已清空');
                // 确保分析按钮状态正确
                analyzeBtn.disabled = false;
            });
            

        });
    </script>
</body>
</html>
