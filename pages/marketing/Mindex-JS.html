<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校审岗助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 营销获客部页面样式 */
        .marketing-team-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 20px;
            justify-items: start;
        }
        
        
        .position-card {
            width:330px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        /* 原卡片hover效果已移至position-link:hover中 */
        
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }
        
        .position-name {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            margin-top: 10px;
        }
        
        .position-description {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.6;
            padding: 10px 24px 20px 24px;

        }
        
        /* 链接样式，保持与原卡片一致 */
        .position-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .position-link:hover .position-card {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        

        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            margin: 20px;
        }
        
        .page-header h1 {
            font-size: 32px;
            color: #1831a1;
            margin-bottom: 12px;
        }
        
        .page-header p {
            font-size: 16px;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
        }
        .Mcontent {
            margin-left: 240px;
        }

        .Mpage-content {
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件
        // loadNavigation内部已经按顺序加载顶部导航和左侧导航
        const navigationPromise = new Promise((resolve) => {
            // 重写loadNavigation的then回调，在导航加载完成后显示主内容
            const originalLoadNavigation = window.loadNavigation;
            window.loadNavigation = function(basePath, activeRole) {
                originalLoadNavigation(basePath, activeRole);
                // 由于loadNavigation内部是异步加载，我们使用setTimeout确保导航加载完成
                setTimeout(() => {
                    resolve();
                }, 100);
            };
            
            // 调用修改后的loadNavigation
            window.loadNavigation('../../', 'front');
        });
        
        // 导航加载完成后显示主内容
        navigationPromise.then(() => {
            document.getElementById('main-content-container').style.display = 'block';
        });
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar">
            <!-- 左侧导航将通过JavaScript动态加载 -->
        </aside>

        <!-- 主内容区域 -->
        <main class="Mcontent" id="main-content-container" style="display: none;">           
            <div class="Mpage-content">
                <h1 style="text-align: left; color: #9a9a9a; font-size: 28px;">「校审岗」智能小助手</h1>
                <div class="marketing-team-container">
                    <!-- 助手1：违禁词检查助手 -->
                    <a href="prohibited-words-check.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/2-1weijinci.jpg" alt="违禁词检查助手" style="width:326px;height: 163px;border-radius: 8%;">  
                            <h3 class="position-name">违禁词检查助手</h3>
                            <p class="position-description">自动检查文本中是否包含违禁词，帮助您确保内容符合法律要求。</p>
                        </div>
                    </a>
                    
                    <!-- 助手2：文字校对助手 -->
                    <a href="text-proofreading-assistant.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/8-4XIN.jpg" alt="文字校对助手" style="width:326px;height: 163px;border-radius: 8%;">  
                            <h3 class="position-name">文字校对助手</h3>
                            <p class="position-description">智能校对文本中的错别字、语法错误和标点符号问题，提升内容质量和专业性。</p>
                        </div>
                    </a>
                    
                    <!-- 助手3：分镜头助手 -->
                    <a href="storyboard-assistant.html" class="position-link">
                        <div class="position-card">
                            <img src="../../images/3-2shipinjianji.jpg" alt="分镜头助手" style="width:326px;height: 163px;border-radius: 8%;">  
                            <h3 class="position-name">分镜头助手</h3>
                            <p class="position-description">智能生成分镜头脚本，规划视频拍摄流程，提供专业的镜头设计和场景建议。</p>
                        </div>
                    </a>
                    
                </div>
            </div>
        </main>
    </div>
    
</body>
</html>
