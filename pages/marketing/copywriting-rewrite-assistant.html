<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案二创助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 定义CSS变量，便于统一管理样式 */
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --border-color: #e8e8e8;
            --text-primary: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-hover: #f5f5f5;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.08);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }
        
        /* 左右对比布局 */
        .comparison-layout {
            display: flex;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: var(--shadow-light);
        }
        
        @media (max-width: 768px) {
            .comparison-layout {
                flex-direction: column;
                padding: 16px;
                margin: 0 16px;
            }
        }
        
        .comparison-panel {
            flex: 1;
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-primary);
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .panel-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-height: 300px;
        }
        
        .panel-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }
        
        /* 输入区域样式 */
        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .input-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            resize: vertical;
            transition: var(--transition);
            background-color: var(--bg-primary);
            font-family: inherit;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        /* 风格选项样式 */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 24px 0 16px;
        }
        
        .style-options, .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 768px) {
            .style-options, .option-group {
                grid-template-columns: 1fr;
            }
        }
        
        .style-options label, .option-group label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            transition: var(--transition);
            background-color: var(--bg-primary);
        }
        
        .style-options label:hover, .option-group label:hover {
            border-color: var(--primary-color);
            background-color: rgba(24, 144, 255, 0.05);
        }
        
        .style-options input[type="radio"]:checked + span {
            color: var(--primary-color);
            font-weight: 500;
        }
        
        .style-options input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .option-group input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        /* 按钮样式 */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            min-height: 36px;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-medium);
        }
        
        .action-button.primary:active {
            transform: translateY(0);
        }
        
        .action-button.secondary {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        
        .action-button.secondary:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background-color: var(--bg-primary);
        }
        
        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
            
            .action-button {
                width: 100%;
            }
        }
        
        /* 结果显示样式 */
        .result-content {
            min-height: 300px;
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 20px;
            transition: var(--transition);
            overflow-y: auto;
        }
        
        .result-content.loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(24, 144, 255, 0.05);
        }
        
        .placeholder-text {
            color: var(--text-tertiary);
            font-size: 14px;
            text-align: center;
            margin: 0;
            padding: 40px 0;
        }
        
        /* 改写结果样式 */
        .result-item {
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        
        .result-item h5 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .result-item p {
            margin: 12px 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        
        .result-item strong {
            color: var(--primary-color);
            font-weight: 600;
        }
        
        /* 加载动画 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(24, 144, 255, 0.2);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        /* 使用指南样式 */
        .usage-guide {
            max-width: 1400px;
            margin: 24px auto 40px;
            padding: 20px 24px;
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
        }
        
        .usage-guide h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 16px 0;
        }
        
        .usage-guide ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .usage-guide li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .usage-guide li::before {
            content: "•";
            position: absolute;
            left: 8px;
            color: var(--primary-color);
            font-size: 16px;
        }
        
        /* 成功提示 */
        .success-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #52c41a;
            color: white;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }
        
        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色，指定当前页面路径
        loadNavigation('../../', 'marketing', 'pages/marketing/copywriting-rewrite-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>文案二创助手</h2>
                <p>智能对原文案进行创意改写，保留核心信息的同时优化表达方式</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧面板 - 参数设置 -->
                    <div class="comparison-panel">
                        <div class="panel-header">
                            <h3 class="panel-title">原文案输入与设置</h3>
                        </div>
                        <div class="panel-content">
                            <div class="input-section">
                                <label for="original-copywriting">输入原文案</label>
                                <textarea id="original-copywriting" placeholder="请输入需要改写的原文案内容..."></textarea>
                                
                                <h4 class="section-title">改写风格</h4>
                                <div class="style-options">
                                    <label><input type="radio" name="style" checked> <span>专业商务</span></label>
                                    <label><input type="radio" name="style"> <span>活泼生动</span></label>
                                    <label><input type="radio" name="style"> <span>情感共鸣</span></label>
                                    <label><input type="radio" name="style"> <span>简洁明了</span></label>
                                    <label><input type="radio" name="style"> <span>幽默风趣</span></label>
                                </div>
                                
                                <h4 class="section-title">改写选项</h4>
                                <div class="option-group">
                                    <label><input type="checkbox" checked> 保留关键词</label>
                                    <label><input type="checkbox"> 扩展内容</label>
                                    <label><input type="checkbox" checked> 提升吸引力</label>
                                    <label><input type="checkbox"> 调整语气</label>
                                </div>
                            </div>
                        </div>
                        <div class="panel-footer">
                            <div class="button-group">
                                <button id="rewrite-btn" class="action-button primary">开始改写</button>
                                <button id="clear-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧面板 - 生成结果 -->
                    <div class="comparison-panel">
                        <div class="panel-header">
                            <h3 class="panel-title">改写结果</h3>
                            <button id="copy-result-btn" class="action-button secondary" disabled>复制结果</button>
                        </div>
                        <div class="panel-content">
                            <div id="rewrite-result" class="result-content">
                                <p class="placeholder-text">改写结果将显示在这里...</p>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            
            <!-- 使用指南区域 - 移至功能操作区下方 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入文案：</strong>在文本框中输入需要改写的原文案
                </div>
                <div class="help-item">
                    <strong>2. 选择风格：</strong>选择适合的改写风格，如专业商务、活泼生动等
                </div>
                <div class="help-item">
                    <strong>3. 设置选项：</strong>设置改写选项，如保留关键词、调整语气等
                </div>
                <div class="help-item">
                    <strong>4. 开始改写：</strong>点击「开始改写」获取改写后的文案
                </div>
                <div class="help-item">
                    <strong>5. 多次尝试：</strong>可多次尝试不同风格获得最满意的效果
                </div>
            </div>
        </main>
    </div>
    
    <!-- 成功提示组件 -->
    <div id="success-toast" class="success-toast">操作成功</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const rewriteBtn = document.getElementById('rewrite-btn');
            const originalCopywriting = document.getElementById('original-copywriting');
            const rewriteResult = document.getElementById('rewrite-result');
            const clearBtn = document.getElementById('clear-btn');
            const copyResultBtn = document.getElementById('copy-result-btn');
            const successToast = document.getElementById('success-toast');
            
            // 显示成功提示
            function showToast(message) {
                successToast.textContent = message;
                successToast.classList.add('show');
                setTimeout(() => {
                    successToast.classList.remove('show');
                }, 3000);
            }
            
            // 开始改写按钮事件
            rewriteBtn.addEventListener('click', function() {
                if (originalCopywriting.value.trim()) {
                    // 显示加载状态
                    rewriteResult.innerHTML = '';
                    rewriteResult.classList.add('loading');
                    
                    const spinner = document.createElement('div');
                    spinner.className = 'loading-spinner';
                    
                    const loadingText = document.createElement('p');
                    loadingText.className = 'placeholder-text';
                    loadingText.textContent = '正在进行创意改写，请稍候...';
                    
                    rewriteResult.appendChild(spinner);
                    rewriteResult.appendChild(loadingText);
                    
                    // 禁用生成按钮防止重复点击
                    rewriteBtn.disabled = true;
                    rewriteBtn.style.opacity = '0.6';
                    
                    // 模拟改写过程
                    setTimeout(() => {
                        // 移除加载状态
                        rewriteResult.classList.remove('loading');
                        
                        // 根据选择的风格生成不同的改写结果
                        const selectedStyle = document.querySelector('input[name="style"]:checked').nextElementSibling.textContent;
                        
                        let resultText = '';
                        if (selectedStyle === '专业商务') {
                            resultText = `<div class="result-item">
                                <h5>专业商务风格改写</h5>
                                <p>【业务通告】利客来平台现推出全新会员福利计划，旨在为尊贵客户提供专属权益。该计划涵盖多项增值服务，包括但不限于专属折扣、优先体验及专业顾问支持。诚挚邀请您成为首批体验用户，共同开启商务合作新篇章。</p>
                                <p><strong>优化重点：</strong>正式专业的表达方式，强化服务价值感，突出商业合作氛围。</p>
                            </div>`;
                        } else if (selectedStyle === '活泼生动') {
                            resultText = `<div class="result-item">
                                <h5>活泼生动风格改写</h5>
                                <p>✨ 哇塞！利客来搞大事啦！全新会员福利计划火爆上线～～🎉 这里有超赞的专属折扣、超前体验新品的特权，还有专属顾问一对一服务哦！想不想成为第一批尝鲜的幸运儿？快来加入我们吧，一起嗨起来！💃</p>
                                <p><strong>优化重点：</strong>轻松活泼的语气，丰富的表情符号，增强互动感和吸引力。</p>
                            </div>`;
                        } else if (selectedStyle === '情感共鸣') {
                            resultText = `<div class="result-item">
                                <h5>情感共鸣风格改写</h5>
                                <p>亲爱的朋友，您的支持与信任一直是我们前进的动力。今天，我们怀着感恩之心推出全新会员福利计划，这不仅是一份回馈，更是我们对您一路陪伴的珍视。在这里，您将感受到专属定制的温暖服务，让每一次合作都充满温度与意义。我们期待与您继续并肩同行，共创美好未来。</p>
                                <p><strong>优化重点：</strong>情感化的表达，拉近与客户的距离，建立情感连接。</p>
                            </div>`;
                        } else if (selectedStyle === '简洁明了') {
                            resultText = `<div class="result-item">
                                <h5>简洁明了风格改写</h5>
                                <p>利客来新推会员计划：专属折扣、优先体验、顾问支持。首批会员招募中，报名从速。</p>
                                <p><strong>优化重点：</strong>精简内容，突出核心信息，清晰传达要点。</p>
                            </div>`;
                        } else {
                            resultText = `<div class="result-item">
                                <h5>幽默风趣风格改写</h5>
                                <p>号外号外！利客来的"幸运星"计划正式启动啦～别人还在羡慕，你却可以提前享受！专属折扣？有！优先体验？必须的！私人顾问？安排！别犹豫，再犹豫优惠就要被别人抢走啦！机不可失，时不再来，赶紧上车！😉</p>
                                <p><strong>优化重点：</strong>轻松幽默的语气，增加亲和力，吸引注意力。</p>
                            </div>`;
                        }
                        
                        rewriteResult.innerHTML = resultText;
                        
                        // 启用复制按钮
                        copyResultBtn.disabled = false;
                        
                        // 重新启用生成按钮
                        rewriteBtn.disabled = false;
                        rewriteBtn.style.opacity = '1';
                        
                        showToast('文案改写完成');
                    }, 1500);
                } else {
                    showToast('请输入原文案内容');
                }
            });
            
            // 清空按钮事件
            clearBtn.addEventListener('click', function() {
                originalCopywriting.value = '';
                document.querySelector('input[name="style"]:checked').checked = true;
                document.querySelectorAll('.option-group input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = true;
                });
                rewriteResult.innerHTML = '<p class="placeholder-text">改写结果将显示在这里...</p>';
                copyResultBtn.disabled = true;
            });
            
            // 复制结果按钮事件
            copyResultBtn.addEventListener('click', function() {
                if (!copyResultBtn.disabled) {
                    const resultText = rewriteResult.innerText;
                    if (resultText && !resultText.includes('改写结果将显示在这里') && !resultText.includes('正在进行创意改写')) {
                        navigator.clipboard.writeText(resultText).then(() => {
                            showToast('结果已复制到剪贴板');
                        }).catch(() => {
                            showToast('复制失败，请手动复制');
                        });
                    }
                }
            });
            
            // 风格选择增强交互体验
            document.querySelectorAll('.style-options label').forEach(label => {
                label.addEventListener('click', function() {
                    // 移除所有选中样式
                    document.querySelectorAll('.style-options label').forEach(l => {
                        l.style.borderColor = 'var(--border-color)';
                        l.style.backgroundColor = 'var(--bg-primary)';
                    });
                    
                    // 添加选中样式
                    this.style.borderColor = 'var(--primary-color)';
                    this.style.backgroundColor = 'rgba(24, 144, 255, 0.05)';
                });
            });
            
            // 默认选中第一个风格选项
            document.querySelector('.style-options label').click();
        });
    </script>
</body>
</html>
