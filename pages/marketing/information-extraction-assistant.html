<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息提取助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
            margin-bottom: 0px;
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            height: fit-content;
            min-height: 366px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .input-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
        }

        .input-section textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 文件上传区域样式 */
        .file-upload-section {
            margin-top: 16px;
            position: relative;
        }

        .file-upload-section input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .file-upload-section button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            border: 1px dashed var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
        }

        .file-upload-section button:hover {
            background-color: #e5e7eb;
            border-color: var(--primary-color);
        }

        /* 拖拽上传区域样式 */
        .file-drop-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            margin-top: 16px;
            transition: var(--transition);
            background-color: #f9fafb;
        }

        .file-drop-area.active {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.05);
        }

        .file-drop-area p {
            margin: 0;
            color: var(--text-light);
            font-size: 14px;
        }

        .file-drop-area .file-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* 提取选项样式 */
        .extraction-options {
            margin-bottom: 24px;
            
        }

        .extraction-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 功能选项卡样式 */
        .function-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold; 
        }

        .tab-btn {
            padding: 12px 24px;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-light);
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* 必填项标记 */
        .required {
            color: var(--error-color);
            font-weight: normal;
        }

        /* 输入字段样式 */
        .input-section input[type="text"],
        .input-section input[type="number"],
        .input-section select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            transition: var(--transition);
        }

        .input-section input[type="text"]:focus,
        .input-section input[type="number"]:focus,
        .input-section select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 采集方式选择样式 */
        .collection-method-container {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        
        .collection-method-label {
            flex: 1;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: white;
            color: var(--text-color);
            position: relative;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }
        
        .collection-method-label.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .collection-method-radio {
            position: absolute;
            opacity: 0;
        }
        
        /* 平台选择样式 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .platform-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .platform-options label:hover {
            background-color: #e5e7eb;
        }

        .platform-options input[type="checkbox"] {
            cursor: pointer;
        }

        /* 提取方式选择样式 */
        .extraction-method {
            display: flex;
            border: 1px solid var(--border-color);
            gap: 20px;
            margin-bottom: 20px;
        }

        .extraction-method label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 表格样式 */
        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .result-table th,
        .result-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .result-table th {
            background-color: var(--secondary-color);
            font-weight: 600;
        }

        .result-table tr:hover {
            background-color: rgba(37, 99, 235, 0.05);
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-button:hover {
            background-color: var(--primary-hover);
        }

        .action-button:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
        }

        /* 知识库保存弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .modal {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-close:hover {
            color: var(--text-color);
        }

        .modal-content {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-content {

            min-height: 200px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        .result-item {
            margin-bottom: 24px;
            padding: 16px;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }

        .result-item h5 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
        }

        .keyword-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-tags .tag {
            padding: 6px 12px;
            background-color: var(--secondary-color);
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-color);
        }

        .entity-list {
            margin-top: 0;
            padding-left: 20px;
        }

        .entity-list li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 提取进度条样式 */
        .progress-container {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background-color: var(--secondary-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }
        
        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        /* 提取状态文本 */
        .extraction-status {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 8px;
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色
        loadNavigation('../../', 'marketing');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>信息提取助手</h2>
                <p>智能提取达人、视频和评论数据，并以excel表格方式展现，提供下载，助力市场分析。</p>
            </div>
            
            <div class="page-content">
                <!-- 功能切换选项卡 - 直接添加内联事件处理 -->
                <div class="function-tabs">
                    <button class="tab-btn active" onclick="switchToTab('influencer-data')">达人数据</button>
                    <button class="tab-btn" onclick="switchToTab('video-data')">视频数据</button>
                    <button class="tab-btn" onclick="switchToTab('comment-data')">评论数据</button>
                </div>
                
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <!-- 达人数据面板 -->
                        <div class="tab-content" id="influencer-data">
                            <h3 class="result-header">达人数据提取</h3>
                            
                            <!-- 采集方式选择 - 内联点击事件版本 -->
                            <div class="input-section">
                                <label>采集方式 <span class="required">*</span></label>
                                <div class="collection-method-container" style="display: flex; border-radius: 4px; overflow: hidden;">
                                    <div id="method-link-tab" class="collection-method-tab active" style="padding: 8px 16px; background: #1E88E5; color: white; border: none; cursor: pointer; user-select: none; flex: 1; text-align: center;" onclick="switchCollectionMethod('link')">
                                        达人链接
                                    </div>
                                    <div id="method-keyword-tab" class="collection-method-tab" style="padding: 8px 16px; background: #fff; color: #333; border: none; cursor: pointer; user-select: none; flex: 1; text-align: center;" onclick="switchCollectionMethod('keyword')">
                                        达人关键词
                                    </div>
                                </div>
                            </div>

                                <div class="input-section">
                                    <label for="influencer-platform">支持平台</label>
                                    <div class="platform-options">
                                        <label><input type="radio" name="influencer-platform" value="douyin" checked> 抖音</label>
                                        <label><input type="radio" name="influencer-platform" value="xiaohongshu"> 小红书</label>
                                        <label><input type="radio" name="influencer-platform" value="wechat"> 公众号</label>
                                        <label><input type="radio" name="influencer-platform" value="bilibili"> Bilibili</label>
                                        <label><input type="radio" name="influencer-platform" value="video号"> 视频号</label>
                                    </div>
                                </div>

                                <!-- 达人链接方式输入 -->
                            <div id="link-method-panel">
                                <div class="input-section">
                                    <label for="influencer-link">达人主页链接地址 <span class="required">*</span></label>
                                    <input type="text" id="influencer-link" placeholder="请输入达人主页链接地址">
                                </div>
                            </div>
                            
                            <!-- 达人关键词方式输入 -->
                            <div id="keyword-method-panel" style="display: none;">
                                <div class="input-section">
                                    <label for="influencer-keyword">达人关键词 <span class="required">*</span></label>
                                    <input type="text" id="influencer-keyword" placeholder="请输入达人关键词">
                                </div>
                                
                                <div class="input-section">
                                    <label for="influencer-fans">粉丝数量</label>
                                    <select id="influencer-fans">
                                        <option value="">不限</option>
                                        <option value="1000000-10000000">100w-1000w</option>
                                        <option value="10000-1000000">1w-100w</option>
                                        <option value="1000-10000">1000-1w</option>
                                        <option value="0-1000">0-1000</option>
                                    </select>
                                </div>
                                
                                <div class="input-section">
                                    <label for="influencer-type">用户类型</label>
                                    <select id="influencer-type">
                                        <option value="">不限</option>
                                        <option value="normal">普通用户</option>
                                        <option value="enterprise">企业认证</option>
                                        <option value="personal">个人认证</option>
                                    </select>
                                </div>
                                
                                
                                <div class="input-section">
                                    <label for="influencer-count">导出数量 <span class="required">*</span></label>
                                    <input type="number" id="influencer-count" min="1" max="1000" placeholder="请输入导出数量">
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <button id="extract-influencer-btn" class="action-button">开始提取</button>
                                <button id="clear-influencer-btn" class="secondary-btn">清空</button>
                            </div>
                        </div>
                        
                        <!-- 视频数据面板 -->
                        <div class="tab-content" id="video-data" style="display: none;">
                            <h3 class="result-header">视频数据提取</h3>
                            <div class="input-section">
                                <label>采集方式 <span class="required">*</span></label>
                                <div class="extraction-method" style="display: flex; border-radius: 4px; overflow: hidden; margin-bottom: 15px;">
                                    <div id="video-method-keyword" class="video-method-tab active" style="padding: 8px 16px; background: #1E88E5; color: white; border: none; cursor: pointer; user-select: none; flex: 1; text-align: center;" onclick="switchVideoMethod('keyword')">
                                        关键词搜索
                                    </div>
                                    <div id="video-method-account" class="video-method-tab" style="padding: 8px 16px; background: #fff; color: #333; border: none; cursor: pointer; user-select: none; flex: 1; text-align: center;" onclick="switchVideoMethod('account')">
                                        达人对标账号
                                    </div>
                                </div>
                            </div>
                            <div id="keyword-search-panel">

                            <div class="input-section">
                                <label for="video-platform">支持平台</label>
                                <div class="platform-options">
                                    <label><input type="radio" name="video-platform" value="douyin" checked> 抖音</label>
                                    <label><input type="radio" name="video-platform" value="xiaohongshu"> 小红书</label>
                                    <label><input type="radio" name="video-platform" value="wechat"> 公众号</label>
                                    <label><input type="radio" name="video-platform" value="bilibili"> Bilibili</label>
                                    <label><input type="radio" name="video-platform" value="video号"> 视频号</label>
                                </div>
                            </div>
                                <div class="input-section">
                                    <label for="video-keyword">关键词 <span class="required">*</span></label>
                                    <input type="text" id="video-keyword" placeholder="请输入搜索关键词">
                                </div>
                                
                                <div class="input-section">
                                    <label for="video-sort">排序方式 <span class="required">*</span></label>
                                    <select id="video-sort">
                                        <option value="likes">点赞最多</option>
                                        <option value="latest">最新发布</option>
                                    </select>
                                </div>
                                
                                <div class="input-section">
                                    <label for="video-time">发布时间</label>
                                    <select id="video-time">
                                        <option value="">不限</option>
                                        <option value="day">一天内</option>
                                        <option value="week">一周内</option>
                                        <option value="half-year">半年内</option>
                                    </select>
                                </div>
                                
                                <div class="input-section">
                                    <label for="video-duration">视频时长</label>

                const tabs = document.querySelectorAll('.tab-btn');

                    tab.classList.remove('active');
                });
                
                // 隐藏所有内容面板

                    const element = document.getElementById(panel);
                    if (element) {
                        element.style.display = 'none';
                    }
                });
                
                // 激活当前选中的标签和面板
                const activeTab = document.querySelector(`.tab-btn[onclick="switchToTab('${tabId}')"]`);

                tab.style.cursor = 'pointer';

                const linkMethodPanel = document.getElementById('link-method-panel');
                const keywordMethodPanel = document.getElementById('keyword-method-panel');

                // 确保所有元素存在
                if (linkTab && keywordTab && linkMethodPanel && keywordMethodPanel) {
                    console.log('切换元素存在，执行切换逻辑');
                    
                    // 重置所有标签样式
                    linkTab.classList.remove('active');
                    keywordTab.classList.remove('active');
                    linkTab.style.background = '#fff';
                    keywordTab.style.background = '#fff';
                    linkTab.style.color = '#333';
                    keywordTab.style.color = '#333';
                    
                    // 隐藏所有面板

                    keywordMethodPanel.style.display = 'none';
                    
                    // 设置选中的标签和面板

                    console.log('keywordTab:', keywordTab);
                    console.log('linkMethodPanel:', linkMethodPanel);
                    console.log('keywordMethodPanel:', keywordMethodPanel);

            // 页面加载时初始化

            // 采集方式切换功能已通过新的标签点击事件实现

                    accountTab.style.background = '#fff';
                    keywordTab.style.color = '#333';
                    accountTab.style.color = '#333';

                    accountPanel.style.display = 'none';

                        keywordTab.style.background = '#1E88E5';
                        keywordTab.style.color = 'white';

                        accountTab.style.background = '#1E88E5';

                        accountPanel.style.display = 'block';

            window.addEventListener('load', function() {

                setTimeout(() => {
                    if (window.switchVideoMethod) {
                        window.switchVideoMethod('keyword');

                }, 100);
            });
            
            // 知识库保存类型切换
            saveTypeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === 'new') {
                        newFolderSection.style.display = 'block';
                        existingFolderSection.style.display = 'none';
                    } else {
                        newFolderSection.style.display = 'none';
                        existingFolderSection.style.display = 'block';
                    }
                });
            });
            
            // 打开知识库保存弹窗
            if (saveToKnowledgeBtn) {
                saveToKnowledgeBtn.addEventListener('click', function() {
                    if (extractionResult && (extractionResult.innerHTML.includes('placeholder-text') || extractionResult.innerHTML.includes('loading-text'))) {
                        alert('没有可保存的结果');
                        return;
                    }
                    if (knowledgeModal) {
                        knowledgeModal.style.display = 'flex';
                    }

            }

            function closeModal() {
                knowledgeModal.style.display = 'none';
            }
            
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', closeModal);
            }
            cancelSaveBtn.addEventListener('click', closeModal);
            
            // 点击弹窗外部关闭
            knowledgeModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            // 模拟获取个人知识库二级类目
            function loadKnowledgeBaseCategories() {
                // 模拟从系统获取个人知识库的二级类目
                // 实际应用中，这里应该是一个API调用
                const categories = {
                    'marketing': [

                    'competition': [

                        { id: 'influencer-food', name: '美食达人' },
                        { id: 'influencer-travel', name: '旅行达人' },
                        { id: 'influencer-digital', name: '数码达人' }

                        { id: 'video-fashion', name: '时尚视频' },

            // 加载知识库二级类目到下拉框
            function populateSubCategories() {

            }

            function initKnowledgeBaseModal() {
                populateSubCategories();
                
                // 当选择主目录时，更新子目录选项

                            subCategorySection.style.display = 'block';

            // 模拟提取进度的函数
            function simulateExtractionProgress(extractionType, onComplete) {
                // 显示带进度条的加载状态
                extractionResult.innerHTML = `
                    <div class="loading-text">
                        <span class="loading-spinner"></span>
                        <div>正在提取${extractionType}数据，请稍候...</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="extraction-progress"></div>
                        </div>
                        <div class="extraction-status" id="extraction-status">准备中...</div>
                    </div>
                `;
                
                const progressBar = document.getElementById('extraction-progress');
                const statusText = document.getElementById('extraction-status');
                let progress = 0;
                const statusMessages = [
                    '正在连接数据源...',
                    '正在获取原始数据...',
                    '正在解析数据...',
                    '正在格式化结果...',
                    '准备完成...'
                ];
                
                const interval = setInterval(() => {
                    progress += 2;
                    progressBar.style.width = `${progress}%`;
                    
                    // 更新状态文本
                    const statusIndex = Math.floor(progress / 20);
                    if (statusIndex < statusMessages.length) {
                        statusText.textContent = statusMessages[statusIndex];
                    }
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        // 延迟一点时间再显示结果，让用户看到100%的进度
                        setTimeout(() => {
                            onComplete();
                        }, 300);
                    }
                }, 50);

                simulateExtractionProgress('达人', () => {

                            { link: 'https://example.com/influencer2', douyinId: 'dy654321', name: '美食博主小李', intro: '探寻全国各地美食', age: '32', gender: '男', fans: '850,000', likes: '9,200,000', follows: '280', works: '410', location: '北京' },

                                    return filterFn(fansNum);

                        // 构建统计信息
                        statsInfo = `
                            <div>关键词: ${params.keyword}</div>

                            <div>粉丝数量: ${params.fansRange || '不限'}</div>

                    }
                    
                    // 构建表格，添加统计信息
                    let tableHTML = `
                        <div style="margin-bottom: 16px; padding: 12px; background-color: var(--secondary-color); border-radius: var(--border-radius);">
                            <div style="font-weight: 600; margin-bottom: 8px;">提取统计</div>
                            <div style="display: flex; gap: 24px; flex-wrap: wrap;">
                                ${statsInfo}
                            </div>
                        </div>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th>达人链接</th>
                                    <th>抖音号</th>
                                    <th>达人昵称</th>

                                    <th>年龄</th>
                                    <th>性别</th>

                                    <th>关注</th>
                                    <th>作品数</th>
                                    <th>IP属地</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    influencerData.forEach(item => {
                        tableHTML += `
                            <tr>
                                <td><a href="${item.link}" target="_blank" style="color: var(--primary-color);">查看</a></td>
                                <td>${item.douyinId}</td>

                    showSuccessToast('达人数据提取完成');

            });
            
            // 视频数据提取
            extractVideoBtn.addEventListener('click', function() {
                const method = document.querySelector('input[name="video-method"]:checked').value;
                const count = document.getElementById('video-count').value.trim();
                const selectedPlatforms = Array.from(document.querySelectorAll('#video-data .platform-options input[type="radio"]:checked'))
                    .map(checkbox => checkbox.value);
                
                let isValid = true;
                let message = '';
                let keyword = '';
                let accountLink = '';
                let sortBy = '';
                let timeRange = '';
                let duration = '';
                
                if (method === 'keyword') {
                    keyword = document.getElementById('video-keyword').value.trim();
                    sortBy = document.getElementById('video-sort').value;
                    timeRange = document.getElementById('video-time').value;
                    duration = document.getElementById('video-duration').value;
                    
                    if (!keyword) {
                        isValid = false;
                        message = '请输入搜索关键词';
                    } else if (!count || isNaN(count) || count < 1 || count > 1000) {
                        isValid = false;
                        message = '请输入有效的导出数量（1-1000）';
                    }
                } else {
                    accountLink = document.getElementById('account-link').value.trim();
                    
                    if (!accountLink) {
                        isValid = false;
                        message = '请输入达人对标账号链接';
                    } else if (!count || isNaN(count) || count < 1 || count > 1000) {
                        isValid = false;
                        message = '请输入有效的导出数量（1-1000）';
                    }
                }
                
                if (!isValid) {
                    alert(message);
                    return;
                }
                
                // 记录当前提取的参数，用于保存到知识库
                window.currentExtractionData = {
                    type: 'video',
                    params: {
                        method,
                        keyword,
                        accountLink,
                        count,
                        sortBy,
                        timeRange,
                        duration,
                        platforms: selectedPlatforms
                    },
                    timestamp: new Date().toISOString()
                };
                
                // 模拟提取过程，带进度显示
                simulateExtractionProgress('视频', () => {
                    // 模拟视频数据
                    const videoData = [
                        { title: '最新时尚搭配技巧分享', link: 'https://example.com/video1', keywords: '时尚,搭配,穿搭', likes: '120,000', shares: '8,500', comments: '3,200', publishDate: '2024-01-15', duration: '03:45' },
                        { title: '家常菜谱教程 - 红烧肉', link: 'https://example.com/video2', keywords: '美食,烹饪,红烧肉', likes: '89,000', shares: '5,200', comments: '1,800', publishDate: '2024-01-14', duration: '05:20' },
                        { title: '旅行Vlog - 三亚五日游', link: 'https://example.com/video3', keywords: '旅行,Vlog,三亚', likes: '230,000', shares: '12,000', comments: '4,500', publishDate: '2024-01-13', duration: '08:10' },
                    ];
                    
                    // 构建表格，添加统计信息
                    let tableHTML = `
                        <div style="margin-bottom: 16px; padding: 12px; background-color: var(--secondary-color); border-radius: var(--border-radius);">
                            <div style="font-weight: 600; margin-bottom: 8px;">提取统计</div>
                            <div style="display: flex; gap: 24px; flex-wrap: wrap;">
                                <div>提取方式: ${method === 'keyword' ? '关键词搜索' : '达人对标账号'}</div>
                                ${method === 'keyword' ? `<div>关键词: ${keyword}</div>` : `<div>账号链接: ${accountLink}</div>`}
                                <div>导出数量: ${count}</div>
                                <div>平台数: ${selectedPlatforms.length}</div>
                                <div>实际结果: ${videoData.length} 条</div>
                                <div>提取时间: ${new Date().toLocaleString()}</div>
                            </div>
                        </div>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th>标题</th>
                                    <th>链接</th>
                                    <th>关键词</th>
                                    <th>发布时间</th>
                                    <th>视频时长</th>
                                    <th>点赞数</th>
                                    <th>分享数</th>
                                    <th>评论数</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    videoData.forEach(item => {
                        tableHTML += `
                            <tr>
                                <td style="font-weight: 500;">${item.title}</td>
                                <td><a href="${item.link}" target="_blank" style="color: var(--primary-color);">查看</a></td>
                                <td>${item.keywords}</td>
                                <td>${item.publishDate}</td>
                                <td>${item.duration}</td>
                                <td style="color: var(--primary-color); font-weight: 500;">${item.likes}</td>
                                <td>${item.shares}</td>
                                <td>${item.comments}</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    extractionResult.innerHTML = tableHTML;
                    showSuccessToast('视频数据提取完成');
                });
            });
            
            // 评论数据提取
            extractCommentBtn.addEventListener('click', function() {
                const videoUrl = document.getElementById('video-url').value.trim();
                const count = document.getElementById('comment-count').value.trim();
                
                if (!videoUrl) {
                    alert('请输入视频链接');
                    return;
                }
                
                if (!count || isNaN(count) || count < 1 || count > 1000) {
                    alert('请输入有效的导出数量（1-1000）');
                    return;
                }
                
                // 记录当前提取的参数，用于保存到知识库
                window.currentExtractionData = {
                    type: 'comment',
                    params: {
                        videoUrl,
                        count
                    },
                    timestamp: new Date().toISOString()
                };
                
                // 模拟提取过程，带进度显示
                simulateExtractionProgress('评论', () => {
                    // 模拟评论数据，增加更多字段和真实感
                    const commentData = [
                        { 
                            comment: '内容很实用，学到了很多！这个技巧我正好需要，谢谢分享。', 
                            subComments: '3', 
                            likes: '128',
                            publishTime: '2小时前',
                            videoInfo: '时尚搭配技巧分享', 
                            userInfo: '时尚爱好者',
                            userLevel: 'Lv.3',
                            sentiment: '正面'
                        },
                        { 
                            comment: '这个方法真的有效，感谢分享！我已经试过了，效果不错。', 
                            subComments: '5', 
                            likes: '89',
                            publishTime: '5小时前',
                            videoInfo: '时尚搭配技巧分享', 
                            userInfo: '穿搭新手',
                            userLevel: 'Lv.2',
                            sentiment: '正面'
                        },
                        { 
                            comment: '期待更多这样的内容，希望能多出一些冬季穿搭的教程。', 
                            subComments: '0', 
                            likes: '45',
                            publishTime: '昨天',
                            videoInfo: '时尚搭配技巧分享', 
                            userInfo: '日常关注者',
                            userLevel: 'Lv.1',
                            sentiment: '中性'
                        },
                    ];
                    
                    // 计算情感分析统计
                    const sentimentStats = commentData.reduce((stats, comment) => {
                        stats[comment.sentiment] = (stats[comment.sentiment] || 0) + 1;
                        return stats;
                    }, {});
                    
                    // 构建表格，添加统计信息和情感分析
                    let tableHTML = `
                        <div style="margin-bottom: 16px; padding: 12px; background-color: var(--secondary-color); border-radius: var(--border-radius);">
                            <div style="font-weight: 600; margin-bottom: 8px;">提取统计</div>
                            <div style="display: flex; gap: 24px; flex-wrap: wrap;">
                                <div>视频链接: ${videoUrl}</div>
                                <div>导出数量: ${count}</div>
                                <div>实际结果: ${commentData.length} 条</div>
                                <div>正面评论: ${sentimentStats['正面'] || 0} 条</div>
                                <div>中性评论: ${sentimentStats['中性'] || 0} 条</div>
                                <div>负面评论: ${sentimentStats['负面'] || 0} 条</div>
                                <div>提取时间: ${new Date().toLocaleString()}</div>
                            </div>
                        </div>
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th>评论内容</th>
                                    <th>点赞数</th>
                                    <th>子评论数</th>
                                    <th>发布时间</th>
                                    <th>用户信息</th>
                                    <th>用户等级</th>
                                    <th>情感分析</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    commentData.forEach(item => {
                        // 根据情感设置不同颜色
                        let sentimentColor = '';
                        if (item.sentiment === '正面') sentimentColor = 'style="color: var(--success-color); font-weight: 500;"';
                        else if (item.sentiment === '负面') sentimentColor = 'style="color: var(--error-color); font-weight: 500;"';
                        else sentimentColor = 'style="color: var(--warning-color); font-weight: 500;"';
                        
                        tableHTML += `
                            <tr>
                                <td style="max-width: 250px;">${item.comment}</td>
                                <td style="color: var(--primary-color); font-weight: 500;">${item.likes}</td>
                                <td>${item.subComments}</td>
                                <td>${item.publishTime}</td>
                                <td>${item.userInfo}</td>
                                <td>${item.userLevel}</td>
                                <td ${sentimentColor}>${item.sentiment}</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    extractionResult.innerHTML = tableHTML;
                    showSuccessToast('评论数据提取完成');
                });
            });
            
            // 导出结果
            if (downloadResultBtn) {
                downloadResultBtn.addEventListener('click', function() {
                    if (extractionResult && (extractionResult.innerHTML.includes('placeholder-text') || extractionResult.innerHTML.includes('loading-text'))) {
                        alert('没有可导出的结果');
                        return;
                    }
                
                // 获取当前激活的标签页
                const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-tab');
                let fileName = '';
                
                if (activeTab === 'influencer-data') {
                    fileName = '达人数据';
                } else if (activeTab === 'video-data') {
                    fileName = '视频数据';
                } else if (activeTab === 'comment-data') {
                    fileName = '评论数据';
                }
                
                // 创建CSV格式数据
                const table = extractionResult.querySelector('table');
                if (table) {
                    let csvContent = [];
                    
                    // 获取表头
                    const headers = table.querySelectorAll('thead th');
                    const headerRow = Array.from(headers).map(header => header.textContent);
                    csvContent.push(headerRow.join(','));
                    
                    // 获取数据行
                    const rows = table.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const cells = row.querySelectorAll('td');
                        const dataRow = Array.from(cells).map(cell => {
                            const text = cell.textContent.trim();
                            return '"' + text + '"';
                        });
                        csvContent.push(dataRow.join(','));
                    });
                    
                    // 下载文件
                    const blob = new Blob([csvContent.join('\n')], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${fileName}_${new Date().toISOString().slice(0, 10)}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    showSuccessToast('数据已导出为CSV文件');
                }
            });
            }
        });
    </script>
</body>
</html>
