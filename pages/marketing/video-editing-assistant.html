<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            min-height: 500px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        /* 参数组样式 */
        .parameter-group {
            margin-top: 16px;
        }

        .parameter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .parameter-group select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .parameter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 话术选项样式 */
        .script-options {
            margin-bottom: 24px;
        }

        .script-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 文件上传区域样式 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: #fafafa;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .file-upload-area:hover,
        .file-upload-area.active {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.04);
        }

        .file-upload-area input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .file-upload-area:hover .upload-icon {
            opacity: 0.8;
        }

        .upload-text {
            color: var(--text-light);
            line-height: 1.5;
        }

        .upload-text div:first-child {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .upload-text div:last-child {
            font-size: 13px;
            color: var(--text-light);
        }

        /* 文件信息样式 */
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .file-name {
            color: var(--text-color);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 12px;
        }

        .remove-file {
            color: var(--primary-color);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .remove-file:hover {
            background-color: rgba(37, 99, 235, 0.1);
        }

        /* 提炼选项样式 */
        .extraction-options {
            margin-bottom: 24px;
        }

        .extraction-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .option-item label {
            font-weight: 500;
            color: var(--text-color);
            margin-right: 12px;
            min-width: 100px;
        }

        .option-item select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .option-item select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .action-button:hover {
            background-color: var(--primary-hover);
        }

        .action-button:disabled {
        }

        .action-button.secondary {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        .action-button.secondary:hover {
            background-color: #e5e7eb;
        }

        .action-button.small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-header h4 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .result-actions {
            display: flex;
            gap: 12px;
        }

        .result-content {
            flex: 1;
            min-height: 200px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        /* 话术内容样式 */
        .script-content {
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .script-content h5 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .script-content p {
            margin-bottom: 12px;
            line-height: 1.6;
            color: var(--text-color);
        }

        /* 文本结果样式 */
        .text-result {
            color: var(--text-color);
        }

        .text-result h4 {
            margin-top: 20px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 500;
        }

        .text-result p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>

</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色
        loadNavigation('../../', 'marketing');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>视频剪辑助手（敬请期待）</h2>
                <p>智能辅助视频剪辑，快速完成剪辑、特效添加和字幕生成</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <div class="result-header">
                        <h3>剪辑素材与配置</h3>
                        </div>
                            
                        
                        
                        <div class="action-buttons">
                            <button id="extract-btn" class="action-button" disabled>开始剪辑</button>
                            <button id="reset-btn" class="action-button secondary" disabled>重置</button>
                        </div>
                    </div>

                    <!-- 右侧结果面板 -->
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h4>剪辑结果</h4>
                        </div>


                        
                    </div>
                </div>
                
            </div>
            <!-- 使用指南区域 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>功能1：</strong>说明
                </div>
            </div>

        </main>
    </div>
    
</body>
</html>
