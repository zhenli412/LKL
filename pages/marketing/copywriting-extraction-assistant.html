<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案提取助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --danger-color: #EF4444;
            --border-radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 0 auto;
            max-width: 1200px;
            width: 100%;
            align-items: stretch;
        }
        
        /* 面板基础样式 */
        .comparison-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            flex-direction: column;
        }
        
        /* 左侧面板 */
        .input-panel {
            min-height: 370px;
            border: 1px solid #e8e8e8;
        }
        
        /* 右侧面板 */
        .output-panel {
            min-height: 370px;
            border: 1px solid #e8e8e8;
        }
        
        /* 输入区域样式 */
        .input-section {
            margin-bottom: 15px;
        }
        
        .input-section label {
            display: none;
        }
        
        /* 平台选项样式 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }
        
        .platform-options label {
            display: flex !important;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #f3f4f6;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .platform-options label:hover {
            background-color: #e5e7eb;
        }
        
        .platform-options input[type="radio"] {
            cursor: pointer;
        }
        
        .input-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
        }
        
        .result-actions {
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* 文件上传区域 */
        .file-upload-section {
            margin-top: 16px;
            gap: 12px;
        }
        
        .file-drop-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--secondary-color);
            margin-top: 12px;
        }
        
        .file-drop-area:hover,
        .file-drop-area.highlight {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.05);
        }
        
        .file-drop-text {
            color: var(--text-secondary);
        }
        
        .file-tip {
            font-size: 12px;
            margin-top: 4px;
            color: var(--text-secondary);
        }
        
        #file-upload {
            display: none;
        }
        
        /* 提取选项样式 */
        .extraction-options {
            margin-bottom: 24px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
        }
        
        .extraction-options h4 {
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .option-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .option-group label:hover {
            color: var(--primary-color);
        }
        
        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .action-button {
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        .action-button.secondary {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .action-button.secondary:hover {
            background-color: var(--secondary-color);
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 结果面板样式 */

        
        .result-header h4 {
            color: var(--text-primary);
            margin: 0;
        }
        
        .result-content {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--secondary-color);
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .placeholder-text {
            color: var(--text-secondary);
            text-align: center;
            padding: 40px 0;
            margin: 0;
        }
        
        .result-item {
            margin-bottom: 20px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
        }
        
        .result-item h5 {
            margin: 0 0 12px 0;
            color: var(--text-primary);
            font-size: 16px;
        }
        
        .result-item ul {
            margin: 0;
            padding-left: 20px;
        }
        
        .result-item li {
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        /* 加载动画 */
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 加载状态布局 */
        .loading-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
        
        .result-content.loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
        
        /* 加号图标 */
        .icon-plus {
            margin-left: 5px;
            cursor: pointer;
        }
        
        /* 进度条样式 */
        .progress-container {
            width: 100%;
            background-color: #f1f1f1;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        /* 功能标签样式 */
        .function-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-btn:hover {
            color: var(--primary-color);
        }
        
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: bold;
        }
        
        /* 输入区域样式 */
        .input-section {
            margin-bottom: 20px;
        }
        
        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .input-section input[type="text"],
        .input-section input[type="number"],
        .input-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-section input:focus,
        .input-section textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        /* 平台选择样式 */
        .platform-options {
            display: flex;
            gap: 20px;
        }
        
        .platform-options label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }
        
        .platform-options input[type="radio"] {
            margin-right: 8px;
        }
        
        /* 必填项标记 */
        .required {
            color: #e74c3c;
        }
        
        /* 字段配置按钮样式 */
        .fields-config-btn {
            width: 100%;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        
        .fields-config-btn:hover {
            background-color: #e9ecef;
        }
        
        /* 操作按钮区域 */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-secondary {
            background-color: #ecf0f1;
            color: #333;
        }
        
        .btn-secondary:hover {
            background-color: #bdc3c7;
        }
        
        /* 结果区域样式 */
        .result-content {
            margin-top: 15px;
        }
        
        #result-textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        /* 比较布局 */
        .comparison-layout {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .comparison-panel {
            flex: 1;
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 操作按钮样式 */
        .action-button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover {
            background-color: var(--primary-hover);
        }
        
        .action-button.secondary {
            background-color: #ecf0f1;
            color: #333;
        }
        
        .action-button.secondary:hover {
            background-color: #bdc3c7;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .comparison-layout {
                flex-direction: column;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .platform-options {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        /* 视频链接和文案内容样式 */
        .video-link-info {
            margin-bottom: 10px;
        }
        
        .video-url {
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            margin: 5px 0 10px 0;
        }
        
        .copywriting-content h6 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .copywriting-content p {
            margin: 0;
            line-height: 1.6;
            color: var(--text-primary);
        }
        
        /* 结果分隔线样式 */
        .result-divider {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }
        
        /* 结果统计信息样式 */
        .result-summary {
            margin-top: 10px;
            padding: 10px;
            background-color: var(--secondary-color);
            border-radius: 4px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-header h3 {
            margin: 0;
            color: var(--text-primary);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .close-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .save-type-selection {
            margin-bottom: 20px;
        }
        
        .save-type-selection label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 8px 0;
        }
        
        .save-type-selection input[type="radio"] {
            margin-right: 8px;
        }
        
        .save-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .save-section input[type="text"],
        .save-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .save-section input[type="text"]:focus,
        .save-section select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(41, 128, 185, 0.1);
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        /* 使用指南样式 */
        .usage-guide {
            margin-top: 24px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            grid-column: 1 / -1;
        }
        
        .usage-guide h3 {
            margin-top: 0;
            color: var(--text-primary);
        }
        
        .usage-guide ul {
            margin-bottom: 0;
        }
        
        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 80px;
            right: 24px;
            background-color: var(--success-color);
            color: white;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
        }
        
        .result-actions .action-button {
            padding: 8px 16px;
            font-size: 16px;
            flex: none;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
            
            .comparison-panel {
                min-height: auto;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <!-- 成功提示组件 -->
    <div id="success-toast" class="success-toast">操作成功</div>
    
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色，指定当前页面路径
        loadNavigation('../../', 'marketing', 'pages/marketing/copywriting-extraction-assistant.html');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>文案提取助手</h2>
                <p>智能识别并提取各类素材中的优质文案片段，助力内容创作</p>
            </div>
            
            <div class="page-content">
                <!-- 功能切换选项卡 -->
                <div class="function-tabs">
                    <button class="tab-btn active" onclick="switchToTab('video-link-tab')">短视频链接提取文案</button>
                    <button class="tab-btn" onclick="switchToTab('influencer-tab')">达人主页提取文案</button>
                </div>
                
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <!-- 短视频链接方式 -->
                        <div class="tab-content" id="video-link-tab">
                            <h3 class="result-header">输入短视频链接</h3>

                            <!-- 平台选择 -->
                            <div class="input-section">
                                <label>平台选择 <span class="required">*</span></label>
                                <div class="platform-options">
                                    <label><input type="radio" name="platform" value="douyin" checked> 抖音</label>
                                    <label><input type="radio" name="platform" value="xiaohongshu"> 小红书</label>
                                </div>
                            </div>
                            <!-- 链接输入区域 -->
                            <div class="input-section">
                                <label for="video-links-input">短视频链接 <span class="required">*</span></label>
                                <textarea id="video-links-input" placeholder="请输入短视频链接（多条请换行分隔）" rows="6"></textarea>
                            </div>
                            
                            
                            <!-- 自定义导出字段 -->
                            
                            <div class="action-buttons">
                                <button id="video-extract-btn" class="action-button primary">开始提取</button>
                                <button id="video-clear-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                        
                        <!-- 达人主页方式 -->
                        <div class="tab-content" id="influencer-tab" style="display: none;">
                            <h3 class="result-header">输入达人主页链接</h3>
                            
                            <!-- 达人链接输入 -->
                            <div class="input-section">
                                <label for="influencer-link">达人链接地址（抖音平台） <span class="required">*</span></label>
                                <input type="text" id="influencer-link" placeholder="请输入达人主页链接地址">
                            </div>
                            
                            <!-- 提取文案数量 -->
                            <div class="input-section">
                                <label for="extract-count">提取短视频数量 <span class="required">*</span></label>
                                <input type="number" id="extract-count" min="1" max="100" placeholder="请输入提取数量">
                            </div>
                            
                            
                            <div class="action-buttons">
                                <button id="influencer-extract-btn" class="action-button primary">开始提取</button>
                                <button id="influencer-clear-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧结果面板 -->
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h3>提取文案结果</h3>
                        </div>
                        <div id="extraction-result" class="result-content" style="position: relative;">
                            <p class="placeholder-text">请选择功能并设置参数后，点击「开始提取」按钮</p>
                            <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                <span style="font-size: 18px;">📝</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 使用指南区域 - 移至功能操作区下方 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入内容：</strong>粘贴短视频链接（多条请换行分隔）
                </div>
                <div class="help-item">
                    <strong>2. 开始提取：</strong>点击「提取文案」按钮进行文案智能识别
                </div>
                <div class="help-item">
                    <strong>3. 查看结果：</strong>查看提取结果，可复制或保存至知识库
                </div>
                <div class="help-item">
                    <strong>4. 继续使用：</strong>提取完成后可继续提取新的内容
                </div>
            </div>
            
            <style>
                /* 使用指南样式 */
                .help-section {
                    background-color:#ffffff;
                    border-radius: 8px;
                    padding: 20px;
                    margin-top: 30px;
                }
            </style>
        </main>
    </div>
    
    <!-- 功能相关的JS -->
        <script>
            // 标签页切换功能
            function switchToTab(tabId) {
                // 隐藏所有标签内容
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = 'none';
                });
                
                // 移除所有标签按钮的active类
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                // 显示选中的标签内容
                document.getElementById(tabId).style.display = 'block';
                
                // 为选中的标签按钮添加active类
                const allButtons = document.querySelectorAll('.tab-btn');
                for (let i = 0; i < allButtons.length; i++) {
                    if (allButtons[i].getAttribute('onclick').includes(tabId)) {
                        allButtons[i].classList.add('active');
                        break;
                    }
                }
                
                // 重置结果区域
                document.getElementById('result-textarea').value = '';
            }
            
            // 字段配置弹窗 - 实现自定义导出字段功能
            
            // 清空表单
            function clearVideoForm() {
                document.getElementById('video-links-input').value = '';
                document.querySelectorAll('input[name="platform"]')[0].checked = true;
            }
            
            function clearInfluencerForm() {
                document.getElementById('influencer-link').value = '';
                document.getElementById('extract-count').value = '';
            }
            
            // 模拟提取功能 - 已移除模拟结果代码
            // 下载结果功能 - 已移除模拟结果代码
            
            // 事件监听器设置
            function updateFieldsLabel() {
                const selectedPlatform = document.querySelector('input[name="platform"]:checked');
                const platformValue = selectedPlatform ? selectedPlatform.value : 'douyin';
                console.log('当前选中平台值:', platformValue);
                
                // 根据平台值正确设置名称
                let platformName;
                let fieldCount;
                
                if (platformValue === 'douyin') {
                    platformName = '抖音';
                    fieldCount = 12; // 抖音平台有12个字段
                } else if (platformValue === 'xiaohongshu') {
                    platformName = '小红书';
                    fieldCount = 11; // 小红书平台有11个字段
                } else {
                    platformName = '抖音'; // 默认值
                    fieldCount = 12; // 默认12个字段
                }
                
                console.log('将显示平台名称:', platformName);
                
                // 更新两个标签的文本
                const videoLabel = document.getElementById('video-fields-label');
                const influencerLabel = document.getElementById('influencer-fields-label');
                if (videoLabel) videoLabel.textContent = `${platformName}自定义导出字段`;
                if (influencerLabel) influencerLabel.textContent = `${platformName}自定义导出字段`;
                
                // 更新按钮文本，保持已选择字段数量不变
                const configBtns = document.querySelectorAll('.fields-config-btn');
                configBtns.forEach(btn => {
                    // 尝试提取当前已选择的数量
                    const match = btn.innerHTML.match(/已选择(\d+)项/);
                    const selectedCount = match ? parseInt(match[1]) : fieldCount; // 如果无法提取，默认为全选
                    btn.innerHTML = `共${fieldCount}项，已选择${Math.min(selectedCount, fieldCount)}项 <span>⚙️</span>`;
                });
            }

            function setupEventListeners() {
                console.log('开始设置事件监听器...');
                
                // 初始更新标签文本
                updateFieldsLabel();
                
                // 为平台选择按钮添加事件监听器
                document.querySelectorAll('input[name="platform"]').forEach(radio => {
                    radio.addEventListener('change', updateFieldsLabel);
                });
                
                // 字段配置按钮 - 使用类选择器批量设置
                const configBtns = document.querySelectorAll('.fields-config-btn');
                console.log('找到字段配置按钮数量:', configBtns.length);
                configBtns.forEach((btn, index) => {
                    console.log(`设置按钮[${index}]的点击事件:`, btn.id);
                    // 移除可能存在的旧事件监听器
                    btn.onclick = null;
                    // 添加新的点击事件
                    btn.onclick = function() {
                        console.log(`按钮${btn.id}被点击，准备打开弹窗`);
                        openFieldsConfigModal();
                    };
                });
                
                // 清空按钮
                const clearBtns = document.querySelectorAll('[id$="-clear-btn"]');
                clearBtns.forEach(btn => {
                    btn.onclick = function() {
                        if (btn.id === 'video-clear-btn') {
                            console.log('清空视频表单');
                            document.getElementById('video-links-input').value = '';
                            document.querySelectorAll('input[name="platform"]')[0].checked = true;
                        } else if (btn.id === 'influencer-clear-btn') {
                            console.log('清空达人表单');
                            document.getElementById('influencer-link').value = '';
                            document.getElementById('extract-count').value = '';
                        }
                    };
                });
                
                // 提取按钮 - 保留按钮结构，移除模拟结果代码
                const extractBtns = document.querySelectorAll('[id$="-extract-btn"]');
                extractBtns.forEach(btn => {
                    btn.onclick = function() {
                        console.log(`提取按钮被点击: ${btn.id}`);
                        // 移除模拟结果代码，按钮保持存在供后续实际功能开发
                    };
                });
                
                // 下载按钮 - 保留按钮结构，移除模拟结果代码
                const downloadBtn = document.getElementById('download-result-btn');
                if (downloadBtn) {
                    downloadBtn.onclick = function() {
                        console.log('下载按钮被点击');
                        // 移除模拟结果代码，按钮保持存在供后续实际功能开发
                    };
                }
                
                console.log('事件监听器设置完成');
            }
            
            // 在DOM加载完成后设置事件监听器
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupEventListeners);
            } else {
                setupEventListeners();
            }
            
            // 双重保险：在window.load时再次设置
            window.addEventListener('load', setupEventListeners);
            
            // 直接为两个按钮单独设置点击事件
            const videoFieldsConfigBtn = document.getElementById('video-fields-config-btn');
            const influencerFieldsConfigBtn = document.getElementById('influencer-fields-config-btn');
            
            if (videoFieldsConfigBtn) {
                videoFieldsConfigBtn.onclick = function() {
                    console.log('视频字段配置按钮被点击');
                    openFieldsConfigModal();
                };
            }
            
            if (influencerFieldsConfigBtn) {
                influencerFieldsConfigBtn.onclick = function() {
                    console.log('达人字段配置按钮被点击');
                    openFieldsConfigModal();
                };
            }
        </script>

</body>
</html>
