<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>违禁词检查助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
            margin-bottom: 0px;
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            height: fit-content;
            min-height: 360px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
        margin-bottom: 15px;
        }

        .input-section label {
        display: none;
        }
        .input-section textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .input-section textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
        font-size: 14px;
        transition: var(--transition);
        }


        /* 平台选择样式 - 参照信息提取助手 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .platform-options label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
        }

        .platform-options input[type="radio"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 分析选项样式 */
        .analysis-options {
            margin-bottom: 24px;
        }

        .analysis-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .action-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .action-button:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
            opacity: 0.7;
        }
        .action-button.secondary {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
            border-color: #d1d5db;
        }
        
        .secondary-btn:active {
            transform: translateY(1px);
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-content {
            flex: 1;
            min-height: 200px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        .result-item {
            margin-bottom: 24px;
            padding: 16px;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }

        .result-item h5 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
        }

        .result-item ul {
            margin-top: 0;
            padding-left: 20px;
        }

        .result-item li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .platform-options {
                flex-direction: column;
                gap: 8px;
            }
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        /* 搜索按钮样式 */
        .search-button {
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
        }
        
        .modal-content {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-header h3 {
            margin: 0;
            color: var(--text-color);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: var(--transition);
        }
        
        .modal-close:hover {
            background-color: var(--secondary-color);
        }
        
        .modal-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        /* 搜索和筛选区域 */
        .search-filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .category-filter {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            background-color: var(--white);
            cursor: pointer;
        }
        
        /* 知识库分类和文章样式 */
        .knowledge-category {
            margin-bottom: 24px;
        }
        
        .knowledge-category h4 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
        }
        
        .knowledge-articles {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .knowledge-article-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .knowledge-article-item:hover {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.05);
        }
        
        .knowledge-article-item input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 2px;
        }
        
        .article-content {
            flex: 1;
        }
        
        .article-title {
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 4px;
        }
        
        .article-preview {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .article-meta {
            font-size: 12px;
            color: var(--text-light);
        }
        
        /* 成功提示样式 */
        .success-toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .success-toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>

            <!-- 使用指南区域 -->

                </div>
            </div>

            
        </main>
    </div>

    <script>
        // 全局函数，确保可以通过onclick直接调用
        window.showKnowledgeModal = function() {
            console.log('调用 showKnowledgeModal 备用函数');
            const modal = document.getElementById('personal-knowledge-modal');
            if (modal) {
                console.log('备用函数：找到模态框，当前style.display:', modal.style.display);
                // 强制设置为flex
                modal.style.display = 'flex';
                modal.style.zIndex = '2000';
                modal.style.opacity = '1';
                modal.style.visibility = 'visible';
                console.log('备用函数：设置后display:', modal.style.display);
                return true;
            } else {
                console.error('备用函数：未找到模态框元素');
                alert('未找到知识库浮层，请刷新页面重试');
                return false;
            }
        };
        
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM 已加载，初始化模态框功能');
            
            // 显示成功提示
            window.showSuccessToast = function(message) {
                // 移除可能存在的旧提示
                const oldToast = document.querySelector('.success-toast');
                if (oldToast) {
                    oldToast.remove();
                }
                
                // 创建提示元素
                const toast = document.createElement('div');
                toast.className = 'success-toast';
                toast.textContent = message || '操作成功！';
                document.body.appendChild(toast);
                
                // 显示提示
                setTimeout(() => {
                    toast.classList.add('show');
                }, 10);
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(toast);
                    }, 300);
                }, 3000);
            };
            
            // 搜索和筛选功能
            function setupSearchAndFilter() {
                const searchInput = document.getElementById('knowledge-search');
                const categoryFilter = document.getElementById('category-filter');
                const articleItems = document.querySelectorAll('.knowledge-article-item');
                const categories = document.querySelectorAll('.knowledge-category');
                
                // 搜索功能
                searchInput.addEventListener('input', function() {
                    const searchTerm = this.value.toLowerCase();
                    
                    articleItems.forEach(item => {
                        const title = item.querySelector('.article-title').textContent.toLowerCase();
                        const preview = item.querySelector('.article-preview').textContent.toLowerCase();
                        const matchesSearch = title.includes(searchTerm) || preview.includes(searchTerm);
                        
                        const category = item.closest('.knowledge-category').dataset.category;
                        const matchesCategory = categoryFilter.value === 'all' || category === categoryFilter.value;
                        
                        item.style.display = (matchesSearch && matchesCategory) ? 'flex' : 'none';
                    });
                    
                    // 检查每个分类下是否有可见的文章
                    categories.forEach(category => {
                        const visibleArticles = category.querySelectorAll('.knowledge-article-item:not([style*="display: none"])');
                        category.style.display = visibleArticles.length > 0 ? 'block' : 'none';
                    });
                });
                
                // 分类筛选功能
                categoryFilter.addEventListener('change', function() {
                    const selectedCategory = this.value;
                    
                    categories.forEach(category => {
                        if (selectedCategory === 'all' || category.dataset.category === selectedCategory) {
                            category.style.display = 'block';
                        } else {
                            category.style.display = 'none';
                        }
                    });
                    
                    // 触发搜索过滤以应用当前搜索条件
                    searchInput.dispatchEvent(new Event('input'));
                });
            }
            
            // 确认选择按钮功能
            function setupConfirmSelection() {
                const confirmBtn = document.getElementById('confirm-selection-btn');
                
                confirmBtn.addEventListener('click', function() {
                    const selectedItems = document.querySelectorAll('.knowledge-article-item input[type="checkbox"]:checked');
                    const selectedTexts = Array.from(selectedItems).map(checkbox => {
                        const title = checkbox.closest('.knowledge-article-item').querySelector('.article-title').textContent;
                        const preview = checkbox.closest('.knowledge-article-item').querySelector('.article-preview').textContent;
                        return `${title}\n${preview}\n`;
                    });
                    
                    if (selectedTexts.length > 0) {
                        // 将选中的内容添加到输入框
                        const inputTextarea = document.getElementById('txt-input');
                        if (inputTextarea.value) {
                            inputTextarea.value += '\n\n' + selectedTexts.join('\n\n');
                        } else {
                            inputTextarea.value = selectedTexts.join('\n\n');
                        }
                        
                        // 关闭弹窗
                        document.getElementById('personal-knowledge-modal').style.display = 'none';
                        
                        // 显示成功提示
                        showSuccessToast(`已成功添加 ${selectedTexts.length} 条知识库内容`);
                    }
                });
            }
            
            // 检查模态框初始状态
            const modal = document.getElementById('personal-knowledge-modal');
            if (modal) {
                console.log('模态框元素存在，初始display:', modal.style.display);
                // 确保初始状态为隐藏
                modal.style.display = 'none';
            } else {
                console.error('个人知识库模态框未找到');
            }
            
            // 初始化搜索和筛选功能
            setupSearchAndFilter();
            
            // 初始化确认选择功能
            setupConfirmSelection();
        });
    </script>
