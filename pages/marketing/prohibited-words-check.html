<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>违禁词检查助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 定义CSS变量，便于统一管理样式 */
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --border-color: #e8e8e8;
            --text-primary: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-hover: #f5f5f5;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.08);
            --border-radius: 8px;
        }
        
        /* 弹层样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.visible {
            opacity: 1;
        }
        
        .modal-content {
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 24px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-medium);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.visible .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        /* 左右对比布局 */
        .comparison-layout {
            display: flex;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: var(--shadow-light);
        }
        
        @media (max-width: 768px) {
            .comparison-layout {
                flex-direction: column;
                padding: 16px;
            }
        }
        
        .comparison-panel {
            flex: 1;
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .panel-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .panel-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
        }
        
        /* 输入输出区域样式 - 可拖拽高度 */
        .text-area-container {
            position: relative;
            margin-bottom: 16px;
        }
        
        .textarea-wrapper {
            position: relative;
            min-height: 150px; /* 缩短高度 */
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
        }
        
        .input-textarea,
        .output-textarea {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            border: none;
            outline: none;
        }
        
        .input-textarea:focus {
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .output-textarea {
            background-color: var(--bg-secondary);
            cursor: default;
        }
        
        /* 拖拽调整高度 */
        .resize-handle {
            height: 8px;
            background-color: transparent;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            cursor: ns-resize;
        }
        
        .resize-handle:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        
        .resize-handle::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 2px;
            background-color: var(--border-color);
            border-radius: 1px;
        }
        
        .input-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .output-textarea {
            background-color: var(--bg-secondary);
            cursor: default;
        }
        
        /* 按钮样式 */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .action-button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button.primary:hover {
            background-color: var(--primary-hover);
        }
        
        .action-button.secondary {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        
        .action-button.secondary:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background-color: var(--bg-primary);
        }
        
        .action-button.block {
            width: 100%;
            justify-content: space-between;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        /* 检查选项样式 - 横向排布 */
        .check-options {
            margin-bottom: 16px;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
        }
        
        /* 助手提示区域 - 简化版 */
        .helper-section {
            max-width: 1400px;
            margin: 60px auto 40px;
            padding: 20px 24px;
            background-color: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
        }
        
        .helper-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 12px 0;
        }
        
        .helper-tips {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .helper-tips p {
            margin: 4px 0;
        }
        
        /* 结果高亮样式 */
        .corrected {
            background-color: #e6f7ff;
            color: var(--primary-color);
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: 500;
        }
        
        /* 状态提示样式 */
        .status-info {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件，设置基础路径为上上级目录，激活marketing角色
        loadNavigation('../../', 'marketing');
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <div class="page-header">
                <h2>违禁词检查助手</h2>
                <p>智能检测文本中的违规词汇，确保内容合规安全</p>
            </div>
            
            <div class="page-content">
                <!-- 左右对比布局 -->
                <div class="comparison-layout">
                    <!-- 左侧面板 - 原始文案输入 -->
                    <div class="comparison-panel">
                        <div class="panel-header">
                            <h3 class="panel-title">原始文案</h3>
                            <button id="knowledge-modal-btn" class="action-button secondary">
                                <span class="icon">📚</span> 导入知识库
                            </button>
                        </div>
                        <div class="panel-content">
                            <div class="text-area-container">
                                <div class="textarea-wrapper">
                                    <textarea id="check-input" class="input-textarea" placeholder="请在此粘贴需要检查违禁词的文本内容..."></textarea>
                                    <div class="resize-handle"></div>
                                </div>
                            </div>
                            
                            <!-- 检查选项 - 横向排布且默认全选 -->
                            <div class="check-options">
                                <div class="checkbox-group">
                                    <label class="checkbox-item"><input type="checkbox" checked> 敏感词检查</label>
                                    <label class="checkbox-item"><input type="checkbox" checked> 广告法违禁词</label>
                                    <label class="checkbox-item"><input type="checkbox" checked> 错别字检查</label>
                                    <label class="checkbox-item"><input type="checkbox" checked> 语法检查</label>
                                    <label class="checkbox-item"><input type="checkbox" checked> 自动修正违禁词</label>
                                </div>
                            </div>
                        </div>
                        <div class="panel-footer">
                            <div class="button-group">
                                <button id="check-btn" class="action-button primary">开始检查</button>
                                <button id="clear-btn" class="action-button secondary">清空</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧面板 - 修正文案输出 -->
                    <div class="comparison-panel">
                        <div class="panel-header">
                            <h3 class="panel-title">修正文案</h3>
                            <button id="copy-result-btn" class="action-button secondary">
                                <span class="icon">📋</span> 复制结果
                            </button>
                        </div>
                        <div class="panel-content">
                            <div class="text-area-container">
                                    <div class="textarea-wrapper">
                                        <div id="check-result" class="output-textarea">
                                            <p class="placeholder-text">修正后的文案将显示在这里...</p>
                                        </div>
                                        <div class="resize-handle"></div>
                                    </div>
                                </div>
                            <p class="status-info">系统会自动标记并修正检测到的违禁词，修正部分将高亮显示</p>
                        </div>
                        <div class="panel-footer">
                            <button id="add-to-knowledge-btn" class="action-button block secondary">
                                <span class="icon">+</span> 保存到个人知识库
                                <span>▶</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 助手提示区域 - 简化版 -->
                <div class="helper-section">
                    <h3 class="helper-title">使用提示</h3>
                    <div class="helper-tips">
                        <p>1. 输入文本：粘贴需要检查的文本内容，或点击「导入知识库」按钮导入已保存的文案·</p>
                        <p>2. 选择检查项：可选择敏感词、广告法违禁词、错别字、语法检查等多种检查类型·</p>
                        <p>3. 查看修正结果：检查完成后，违规词汇将被修正并以蓝色背景高亮显示·</p>
                        <p>4. 保存结果：可将修正后的文案复制或保存到个人知识库中使用</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 知识库选择弹层 -->
    <div id="knowledge-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">选择个人知识库</h3>
                <button class="modal-close" id="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="knowledge-selector">
                    <div class="selector-item" style="margin-bottom: 16px;">
                        <label class="settings-label">选择一级分类</label>
                        <select id="modal-knowledge-root" class="settings-select">
                            <option value="personal">个人知识库</option>
                        </select>
                    </div>
                    <div class="selector-item" style="margin-bottom: 16px;">
                        <label class="settings-label">选择二级类目</label>
                        <select id="modal-knowledge-category" class="settings-select">
                            <option value="">请选择二级类目</option>
                            <option value="copywriting">文案库</option>
                            <option value="other">其他分类</option>
                        </select>
                    </div>
                    <div class="selector-item">
                        <label class="settings-label">选择知识条目</label>
                        <select id="modal-knowledge-item" class="settings-select">
                            <option value="">请选择知识</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel-btn" class="action-button secondary">取消</button>
                <button id="modal-confirm-btn" class="action-button primary">确认选择</button>
            </div>
        </div>
    </div>
    
    <!-- 保存到知识库弹层 -->
    <div id="save-knowledge-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">保存到个人知识库</h3>
                <button class="modal-close" id="close-save-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="knowledge-save-options">
                    <div class="option-group">
                        <label class="radio-item">
                            <input type="radio" name="save-option" value="new-category" checked>
                            <span>新增类目</span>
                        </label>
                        <div id="new-category-input" style="margin-top: 12px;">
                            <label class="settings-label">新类目名称</label>
                            <input type="text" id="new-category-name" class="settings-input" placeholder="请输入新类目名称">
                        </div>
                    </div>
                    <div class="option-group" style="margin-top: 16px;">
                        <label class="radio-item">
                            <input type="radio" name="save-option" value="existing-category">
                            <span>存储到现有二级类目</span>
                        </label>
                        <div id="existing-category-select" style="margin-top: 12px; display: none;">
                            <label class="settings-label">选择二级类目</label>
                            <select id="save-category-select" class="settings-select">
                                <option value="">请选择二级类目</option>
                                <option value="copywriting">文案库</option>
                                <option value="other">其他分类</option>
                            </select>
                        </div>
                    </div>
                    <div class="common-input" style="margin-top: 16px;">
                        <label class="settings-label">知识条目名称</label>
                        <input type="text" id="knowledge-item-name" class="settings-input" placeholder="请输入知识条目名称">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-cancel-btn" class="action-button secondary">取消</button>
                <button id="save-confirm-btn" class="action-button primary">确认保存</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 实现文本区域可拖拽调整高度
            function makeResizable(element) {
                const handle = element.querySelector('.resize-handle');
                const wrapper = element;
                let isResizing = false;
                
                handle.addEventListener('mousedown', function(e) {
                    isResizing = true;
                    
                    function mousemove(e) {
                        if (!isResizing) return;
                        
                        const rect = wrapper.getBoundingClientRect();
                        const height = e.clientY - rect.top;
                        
                        // 设置最小高度
                        if (height > 100) {
                            wrapper.style.height = height + 'px';
                        }
                    }
                    
                    function mouseup() {
                        isResizing = false;
                        document.removeEventListener('mousemove', mousemove);
                        document.removeEventListener('mouseup', mouseup);
                    }
                    
                    document.addEventListener('mousemove', mousemove);
                    document.addEventListener('mouseup', mouseup);
                    
                    // 防止文本选择
                    e.preventDefault();
                });
            }
            
            // 为输入和输出文本区域添加拖拽功能
            makeResizable(document.querySelectorAll('.text-area-container')[0]);
            makeResizable(document.querySelectorAll('.text-area-container')[1]);
            // 获取DOM元素
            // 模态框元素
            const knowledgeModal = document.getElementById('knowledge-modal');
            const saveKnowledgeModal = document.getElementById('save-knowledge-modal');
            
            // 按钮元素
            const knowledgeModalBtn = document.getElementById('knowledge-modal-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const modalCancelBtn = document.getElementById('modal-cancel-btn');
            const modalConfirmBtn = document.getElementById('modal-confirm-btn');
            const closeSaveModalBtn = document.getElementById('close-save-modal-btn');
            const saveCancelBtn = document.getElementById('save-cancel-btn');
            const saveConfirmBtn = document.getElementById('save-confirm-btn');
            
            // 输入输出元素
            const checkInput = document.getElementById('check-input');
            const checkResult = document.getElementById('check-result');
            const checkBtn = document.getElementById('check-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyResultBtn = document.getElementById('copy-result-btn');
            const addToKnowledgeBtn = document.getElementById('add-to-knowledge-btn');
            
            // 知识库选择元素
            const modalKnowledgeCategory = document.getElementById('modal-knowledge-category');
            const modalKnowledgeItem = document.getElementById('modal-knowledge-item');
            
            // 保存知识选择元素
            const saveOptions = document.querySelectorAll('input[name="save-option"]');
            const newCategoryInput = document.getElementById('new-category-input');
            const existingCategorySelect = document.getElementById('existing-category-select');
            const newCategoryName = document.getElementById('new-category-name');
            const saveCategorySelect = document.getElementById('save-category-select');
            const knowledgeItemName = document.getElementById('knowledge-item-name');
            
            // 模态框动画函数
            function openModal(modal) {
                modal.style.display = 'flex';
                // 添加延迟使动画生效
                setTimeout(() => {
                    modal.classList.add('visible');
                }, 10);
            }
            
            function closeModal(modal) {
                modal.classList.remove('visible');
                // 动画完成后隐藏
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            }
            
            // 知识库选择模态框事件
            knowledgeModalBtn.addEventListener('click', () => openModal(knowledgeModal));
            closeModalBtn.addEventListener('click', () => closeModal(knowledgeModal));
            modalCancelBtn.addEventListener('click', () => closeModal(knowledgeModal));
            
            // 保存到知识库模态框事件
            addToKnowledgeBtn.addEventListener('click', function() {
                const resultText = checkResult.innerText;
                if (resultText && resultText !== '修正后的文案将显示在这里...' && !resultText.includes('placeholder-text')) {
                    openModal(saveKnowledgeModal);
                } else {
                    alert('请先生成修正后的文案');
                }
            });
            
            closeSaveModalBtn.addEventListener('click', () => closeModal(saveKnowledgeModal));
            saveCancelBtn.addEventListener('click', () => closeModal(saveKnowledgeModal));
            
            // 点击模态框外部关闭
            knowledgeModal.addEventListener('click', function(e) {
                if (e.target === knowledgeModal) {
                    closeModal(knowledgeModal);
                }
            });
            
            saveKnowledgeModal.addEventListener('click', function(e) {
                if (e.target === saveKnowledgeModal) {
                    closeModal(saveKnowledgeModal);
                }
            });
            
            // 保存选项切换
            saveOptions.forEach(option => {
                option.addEventListener('change', function() {
                    if (this.value === 'new-category') {
                        newCategoryInput.style.display = 'block';
                        existingCategorySelect.style.display = 'none';
                    } else {
                        newCategoryInput.style.display = 'none';
                        existingCategorySelect.style.display = 'block';
                    }
                });
            });
            
            // 知识库选择联动
            modalKnowledgeCategory.addEventListener('change', function() {
                modalKnowledgeItem.innerHTML = '<option value="">请选择知识</option>';
                
                if (this.value === 'copywriting') {
                    const options = ['产品介绍文案', '营销活动文案', '品牌宣传文案', '社交媒体文案'];
                    options.forEach(option => {
                        const opt = document.createElement('option');
                        opt.value = option;
                        opt.textContent = option;
                        modalKnowledgeItem.appendChild(opt);
                    });
                } else if (this.value === 'other') {
                    const options = ['通用知识', '专业术语', '行业规范'];
                    options.forEach(option => {
                        const opt = document.createElement('option');
                        opt.value = option;
                        opt.textContent = option;
                        modalKnowledgeItem.appendChild(opt);
                    });
                }
            });
            
            // 确认选择知识库内容
            modalConfirmBtn.addEventListener('click', function() {
                const selectedCategory = modalKnowledgeCategory.options[modalKnowledgeCategory.selectedIndex].text;
                const selectedItem = modalKnowledgeItem.value;
                
                if (!selectedCategory || selectedCategory === '请选择二级类目' || !selectedItem) {
                    alert('请完整选择知识库内容');
                    return;
                }
                
                // 模拟从知识库加载内容
                checkInput.value = `这是从"${selectedCategory}"加载的"${selectedItem}"内容示例。\n\n在此示例中包含了一些违禁词汇，如违禁、违规等内容。系统将自动检测并修正这些词汇，确保内容合规安全。`;
                
                // 显示提示信息并关闭弹层
                alert(`已将"${selectedCategory}"下的"${selectedItem}"内容加载到输入框。`);
                closeModal(knowledgeModal);
            });
            
            // 确认保存到知识库
            saveConfirmBtn.addEventListener('click', function() {
                const itemName = knowledgeItemName.value.trim();
                if (!itemName) {
                    alert('请输入知识条目名称');
                    return;
                }
                
                let saveMessage = '';
                const selectedOption = document.querySelector('input[name="save-option"]:checked').value;
                
                if (selectedOption === 'new-category') {
                    const categoryName = newCategoryName.value.trim();
                    if (!categoryName) {
                        alert('请输入新类目名称');
                        return;
                    }
                    saveMessage = `已创建新类目"${categoryName}"并将内容存储为"${itemName}"。`;
                } else {
                    const categorySelect = saveCategorySelect.value;
                    if (!categorySelect) {
                        alert('请选择现有二级类目');
                        return;
                    }
                    const categoryText = saveCategorySelect.options[saveCategorySelect.selectedIndex].text;
                    saveMessage = `已将内容存储到"${categoryText}"下的"${itemName}"。`;
                }
                
                alert(saveMessage);
                // 重置表单
                knowledgeItemName.value = '';
                newCategoryName.value = '';
                saveCategorySelect.value = '';
                document.querySelector('input[name="save-option"][value="new-category"]').checked = true;
                newCategoryInput.style.display = 'block';
                existingCategorySelect.style.display = 'none';
                
                closeModal(saveKnowledgeModal);
            });
            
            // 清空按钮功能
            clearBtn.addEventListener('click', function() {
                checkInput.value = '';
                checkResult.innerHTML = '<p class="placeholder-text">修正后的文案将显示在这里...</p>';
            });
            
            // 复制结果按钮功能
            copyResultBtn.addEventListener('click', function() {
                const resultText = checkResult.innerText;
                if (resultText && resultText !== '修正后的文案将显示在这里...' && !resultText.includes('placeholder-text')) {
                    navigator.clipboard.writeText(resultText).then(function() {
                        alert('结果已复制到剪贴板');
                    }).catch(function() {
                        alert('复制失败，请手动复制');
                    });
                } else {
                    alert('暂无结果可复制');
                }
            });
            
            // 开始检查按钮功能
            checkBtn.addEventListener('click', function() {
                const inputText = checkInput.value.trim();
                if (!inputText) {
                    alert('请输入需要检查的文本内容');
                    return;
                }
                
                // 添加加载动画效果
                checkResult.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-tertiary);">正在检查中...</div>';
                
                // 模拟异步检查过程
                setTimeout(() => {
                    // 模拟检查结果 - 替换违禁词并高亮
                    const correctedText = inputText
                        .replace(/违禁/g, '<span class="corrected">合规</span>')
                        .replace(/违规/g, '<span class="corrected">合规</span>')
                        .replace(/极限词/g, '<span class="corrected">优质</span>')
                        .replace(/虚假/g, '<span class="corrected">真实</span>');
                    
                    // 显示修正结果
                    checkResult.innerHTML = `<div class="processed-text">${correctedText}</div>`;
                }, 800);
            });
        });
    </script>
</body>
</html>
