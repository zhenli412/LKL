<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售信助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/nav-component.js"></script>
    <style>
        /* CSS变量定义 */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --panel-padding: 20px;
            --panel-gap: 24px;
        }

        /* 左右对比布局 */
        .comparison-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--panel-gap);
        }

        /* 面板样式 */
        .comparison-panel {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: var(--panel-padding);
            min-height: 500px;
        }

        /* 输入面板样式 */
        .input-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 输出面板样式 */
        .output-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e8e8;
        }

        /* 面板标题样式 */
        .comparison-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 输入区域样式 */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .input-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
        }

        .input-section textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 参数组样式 */
        .parameter-group {
            margin-top: 16px;
        }

        .parameter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .parameter-group select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .parameter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 话术选项样式 */
        .script-options {
            margin-bottom: 24px;
        }

        .script-options h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-color);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            flex: 1;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .action-button:hover {
            background-color: var(--primary-hover);
        }

        .action-button:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        .secondary-btn {
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .secondary-btn:hover {
            background-color: #e5e7eb;
        }

        /* 结果面板样式 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h3 {
            margin: 0;
        }

        .result-content {
            flex: 1;
            min-height: 200px;
            padding: 16px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            overflow-y: auto;
        }

        /* 话术内容样式 */
        .script-content {
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .script-content h5 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .script-content p {
            margin-bottom: 12px;
            line-height: 1.6;
            color: var(--text-color);
        }

        /* 占位符文本样式 */
        .placeholder-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            padding: 40px 0;
        }

        /* 加载状态样式 */
        .loading-text {
            text-align: center;
            color: var(--primary-color);
            margin: 0;
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 使用指南样式 */
        .usage-guide {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 30px;
        }

        .usage-guide h3 {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .usage-guide ul {
            margin: 0;
            padding-left: 20px;
        }

        .usage-guide li {
            margin-bottom: 8px;
            color: var(--text-color);
        }

        /* 成功提示组件 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .success-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .comparison-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .comparison-panel {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
        
        /* 单行输入框样式 */
        .input-section input[type="text"],
        .input-section select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: inherit;
            transition: var(--transition);
        }

        .input-section input[type="text"]:focus,
        .input-section select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        /* 文件上传区域样式 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--secondary-color);
        }
        
        .file-upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.05);
        }
        
        .file-upload-area input[type="file"] {
            display: none;
        }
        
        .file-upload-text {
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .file-upload-subtext {
            color: var(--text-light);
            font-size: 14px;
        }
        
        .file-info {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background-color: var(--white);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }
        
        .file-info.show {
            display: block;
        }
        
        .file-name {
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 4px;
        }
        
        .file-size {
            color: var(--text-light);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div id="top-nav-container"></div>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar"></aside>

        <!-- 主内容区域 -->
        <main class="content">
            <!-- 页面标题 -->
            <div class="page-header">
                <h2>销售信助手</h2>
                <p>创建专业且有吸引力的个人品牌形象，提升个人影响力和业务转化能力</p>
            </div>
            
            <div class="page-content">
                <div class="comparison-layout">
                    <!-- 左侧输入面板 -->
                    <div class="comparison-panel input-panel">
                        <div class="result-header">
                            <h3>内容配置输入</h3>
                        </div>
                        <div class="input-section">
                                <textarea id="topic-content" placeholder="内容输入..." rows="3"></textarea>
                        </div>

                        <div class="input-section">
                                <labelh>选择参考资料</label>
                                <!-- 知识标题复选框 -->
                                <div style="margin: 15px 0;">
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>🗂️[企业知识库] </span><span>产品营销策略与市场定位分析</span>
                                    </label>
                                    <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                                        <input type="checkbox" checked style="margin-right: 8px;">
                                        <span>📚[个人知识库] </span><span>客户需求洞察与痛点解决方案</span>
                                    </label>
                                </div>
                                <div class="action-buttons" style="margin-top: 10px;">
                                    <button class="action-button secondary"  onclick="openModal('enterprise-knowledge-modal')">+「企业知识库」导入</button>
                                    <button class="action-button secondary"  onclick="openModal('personal-knowledge-modal')">+「个人知识库」导入</button>
                                </div>
                                
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-button primary">生成创作内容</button>
                            <button class="action-button secondary">清空</button>
                        </div>
                        
                    </div>

                    <!-- 右侧结果面板 -->
                    <div class="comparison-panel output-panel">
                        <div class="result-header">
                            <h3>创作结果</h3>
                        </div>
                        <div id="extraction-result" class="result-content" style="position: relative;">
                            <p class="placeholder-text">请选择功能并设置参数后，点击「开始提取」按钮</p>
                            <button class="btn btn-primary" style="position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; cursor: pointer;" title="+ 添加至个人知识库">
                                <span style="font-size: 18px;">📝</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 使用指南区域 - 移至功能操作区下方 -->
            <div class="help-section">
                <h3>使用指南</h3>
                <div class="help-item">
                    <strong>1. 输入销售背景：</strong>填写产品信息、目标受众和销售场景等背景资料
                </div>
                <div class="help-item">
                    <strong>2. 选择风格参数：</strong>设置销售信风格、长度和重点强调内容
                </div>
                <div class="help-item">
                    <strong>3. 生成销售信：</strong>点击「生成销售信」按钮获取专业的销售信函
                </div>
                <div class="help-item">
                    <strong>4. 复制应用：</strong>将生成的销售信复制使用，可根据需要进行个性化修改
                </div>
            </div>
        </main>
    </div>

    <script>
        
        // 页面加载完成后初始化导航组件
        document.addEventListener('DOMContentLoaded', function() {
            // 确保loadNavigation函数存在后再调用
            if (window.loadNavigation) {
                loadNavigation('../../', 'sales', 'sales/sales-letter-assistant.html');
                // 设置当前页面信息，确保导航高亮正确
                window.currentPage = 'sales-letter-assistant.html';
                window.currentSection = 'sales';
            } else {
                console.error('loadNavigation函数未定义');
            }
        });    
    </script>
</body>
</html>
