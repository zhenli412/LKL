<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌助手 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
        <style>
            /* CSS变量定义 */
            :root {
                --primary-color: #2563eb;
                --primary-hover: #1d4ed8;
                --secondary-color: #f3f4f6;
                --text-primary: #1F2937;
                --text-secondary: #6B7280;
                --border-color: #E5E7EB;
                --success-color: #10B981;
                --danger-color: #EF4444;
                --border-radius: 8px;
                --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                --transition: all 0.3s ease;
            }
            
            /* 左右对比布局 */
            .comparison-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin: 0 auto;
                max-width: 1200px;
                width: 100%;
                align-items: stretch;
            }
            
            /* 面板基础样式 */
            .comparison-panel {
                background: #ffffff;
                border-radius: 12px;
                padding: 15px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                flex-direction: column;
            }

            /* 空结果样式 */
            .empty-result {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 300px;
                color: var(--text-secondary);
                text-align: center;
            }

            .empty-icon {
                font-size: 48px;
                margin-bottom: 16px;
            }

            .empty-text {
                font-size: 16px;
            }

            /* 输出操作按钮组 */
            .output-actions {
                display: flex;
                gap: 10px;
            }

            .action-button.small {
                padding: 6px 12px;
                font-size: 14px;
            }

            /* 输出底部按钮 */
            .output-footer {
                margin-top: 15px;
                text-align: right;
            }
            
            /* 左侧面板 */
            .input-panel {
                min-height: 370px;
                border: 1px solid #e8e8e8;
            }
            
            /* 右侧面板 */
            .output-panel {
                min-height: 370px;
                border: 1px solid #e8e8e8;
            }
            
            /* 输入区域样式 */
            .input-section {
                margin-bottom: 15px;
            }
            
            .input-section label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: #333;
            }
            
            .input-section textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                resize: vertical;
                min-height: 100px;
                font-family: inherit;
                font-size: 14px;
                transition: var(--transition);
            }
            
            .result-actions {
                justify-content: flex-end;
                margin-top: 15px;
                padding-top: 15px;
                border-top: 1px solid var(--border-color);
            }
            
            .input-section textarea:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }
            
            /* 选项样式 */
            .option-section {
                margin-bottom: 24px;
                padding: 16px;
                background-color: var(--secondary-color);
                border-radius: var(--border-radius);
            }
            
            .option-section h4 {
                margin-bottom: 12px;
                color: var(--text-primary);
            }
            
            .option-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            
            .option-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                transition: var(--transition);
            }
            
            .option-group label:hover {
                color: var(--primary-color);
            }
            
            /* 按钮样式 */
            .action-buttons {
                display: flex;
                gap: 12px;
                margin-top: 24px;
                padding-top: 20px;
                border-top: 1px solid var(--border-color);
            }
            
            .action-button {
                padding: 12px 24px;
                border-radius: var(--border-radius);
                font-size: 16px;
                font-weight: 500;
                cursor: pointer;
                transition: var(--transition);
                border: none;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            
            .action-button.primary {
                background-color: var(--primary-color);
                color: white;
            }
            
            .action-button.primary:hover {
                background-color: var(--primary-hover);
                transform: translateY(-1px);
            }
            
            .action-button.secondary {
                background-color: white;
                color: var(--text-primary);
                border: 1px solid var(--border-color);
            }
            
            .action-button.secondary:hover {
                background-color: var(--secondary-color);
            }
            
            /* 结果面板样式 */
            .result-header h4 {
                color: var(--text-primary);
                margin: 0;
            }
            
            .result-content {
                flex: 1;
                padding: 12px;
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                background-color: var(--secondary-color);
                overflow-y: auto;
                margin-bottom: 15px;
                min-height: 250px;
            }
            
            .placeholder-text {
                color: var(--text-secondary);
                text-align: center;
                padding: 40px 0;
                margin: 0;
            }
            
            .result-item {
                margin-bottom: 20px;
                padding: 16px;
                background-color: var(--secondary-color);
                border-radius: var(--border-radius);
            }
            
            /* 加载动画 */
            .loading-spinner {
                border: 3px solid #f3f3f3;
                border-radius: 50%;
                border-top: 2px solid #3498db;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto;
            }
            
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            
            /* 功能标签样式 */
            .function-tabs {
                display: flex;
                margin-bottom: 20px;
                border-bottom: 1px solid #eaeaea;
            }
            
            .tab-btn {
                padding: 10px 20px;
                background: none;
                border: none;
                cursor: pointer;
                font-size: 16px;
                color: #666;
                border-bottom: 2px solid transparent;
                transition: all 0.3s ease;
            }
            
            .tab-btn:hover {
                color: var(--primary-color);
            }
            
            .tab-btn.active {
                color: var(--primary-color);
                border-bottom-color: var(--primary-color);
                font-weight: bold;
            }
            
            /* 输入区域样式 */
            .input-section input[type="text"],
            .input-section input[type="number"],
            .input-section textarea {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            .input-section input:focus,
            .input-section textarea:focus {
                outline: none;
                border-color: #3498db;
            }
            
            /* 必填项标记 */
            .required {
                color: #e74c3c;
            }
            
            /* 按钮样式 */
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-primary {
                background-color: var(--primary-color);
                color: white;
            }
            
            .btn-primary:hover {
                background-color: var(--primary-hover);
            }
            
            /* 使用指南样式 */
            .help-section {
                background-color:#ffffff;
                border-radius: 8px;
                padding: 20px;
                margin-top: 30px;
            }
            
            .help-item {
                margin-bottom: 10px;
            }
            
            /* 成功提示组件 */
            .success-toast {
                position: fixed;
                top: 20px;
                right: 20px;
                background-color: var(--success-color);
                color: white;
                padding: 12px 20px;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                opacity: 0;
                transform: translateY(-20px);
                transition: opacity 0.3s ease, transform 0.3s ease;
                z-index: 1000;
            }
            
            .success-toast.show {
                opacity: 1;
                transform: translateY(0);
            }
        </style>
</head>

    <!-- 功能相关的JS -->
    <script>
        // 标签页切换功能
        function switchToTab(tabId) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });
            
            // 移除所有标签按钮的active类
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示选中的标签内容
            document.getElementById(tabId).style.display = 'block';
            
            // 为选中的标签按钮添加active类
            event.target.classList.add('active');
