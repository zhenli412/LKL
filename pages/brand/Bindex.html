<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌支持部 - 利客来</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* 营销获客部页面样式 */
        .marketing-team-container {
            display: flex;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            padding: 20px;
            justify-items: start;
        }
        
        .position-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .position-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            background-color: #fff;
        }
        
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background-color: #eff2e7;
            border-radius: 50%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: #ebebeb;
            font-size: 30px;
            font-weight: 600;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.3"><path d="M50,15 C60,15 68,23 68,33 C68,43 60,51 50,51 C40,51 32,43 32,33 C32,23 40,15 50,15 Z M72,60 L72,85 L28,85 L28,60 C30,56 40,50 50,50 C60,50 70,56 72,60 Z" fill="%23666"/></svg>');
            background-size: 100%;
            background-position: center 20px;
            background-repeat: no-repeat;
            padding-bottom: 15px;
            position: relative;
        }
        
        .position-name {
            font-size: 22px;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
        }
        
        .position-description {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.6;
        }
        
        /* 链接样式 - 保持与普通卡片一致 */
        .position-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 330px;
        }
        
        /* 链接样式 - 保持与普通卡片一致 */
        .position-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .position-link:hover .position-card {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        

        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            margin: 20px;
        }
        
        .page-header h1 {
            font-size: 32px;
            color: #1831a1;
            margin-bottom: 12px;
        }
        
        .page-header p {
            font-size: 16px;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
        }
        .Mcontent {
            margin-left: 240px;
        }

        .Mpage-content {
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


    </style>
</head>
<body>
    <!-- 导航组件将通过JavaScript动态加载 -->
    <script src="../../js/menu.js"></script>
    <script src="../../js/nav-component.js"></script>
    <script>
        // 加载统一导航组件
        // loadNavigation内部已经按顺序加载顶部导航和左侧导航
        const navigationPromise = new Promise((resolve) => {
            // 重写loadNavigation的then回调，在导航加载完成后显示主内容
            const originalLoadNavigation = window.loadNavigation;
            window.loadNavigation = function(basePath, activeRole) {
                originalLoadNavigation(basePath, activeRole);
                // 由于loadNavigation内部是异步加载，我们使用setTimeout确保导航加载完成
                setTimeout(() => {
                    resolve();
                }, 100);
            };
            
            // 调用修改后的loadNavigation
            window.loadNavigation('../../', 'front');
        });
        
        // 导航加载完成后显示主内容
        navigationPromise.then(() => {
            document.getElementById('main-content-container').style.display = 'block';
        });
    </script>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 左侧导航菜单 -->
        <aside class="sidebar">
            <!-- 左侧导航将通过JavaScript动态加载 -->
        </aside>

        <!-- 主内容区域 (初始隐藏，等待导航加载完成后显示) -->
        <main class="Mcontent" id="main-content-container" style="display: none;">           
            <div class="Mpage-content">
                <h1 style="text-align: left; color: #9a9a9a; font-size: 28px;">「品牌支持部」</h1>
                <div class="marketing-team-container">
                    <!-- 岗位1：品牌岗 -->
                    <a href="Bindex-B.html" class="position-link">
                        <div class="position-card">
                            <div class="avatar-placeholder"></div>
                            <h3 class="position-name">品牌岗</h3>
                            <p class="position-description">负责品牌故事策划、发言稿、产品命名、公文写作、广告语生成等，打造专业品牌形象。</p>
                        </div>
                    </a>
                    
                    <!-- 岗位2：支持岗 -->
                    <a href="../support/Sindex-S.html" class="position-link">
                        <div class="position-card">
                            <div class="avatar-placeholder"></div>
                            <h3 class="position-name">支持岗</h3>
                            <p class="position-description">负责合同法务文书、合同审核和岗位职责JD，提供专业的法律支持和人力资源文档服务。</p>
                        </div>
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // 页面加载时设置当前用户名和处理登出功能
        document.addEventListener('DOMContentLoaded', function() {
            // 获取并显示当前用户名
            const currentUsername = localStorage.getItem('currentUsername');
            if (currentUsername) {
                document.getElementById('current-user').textContent = currentUsername;
            }
            
            // 登出功能实现
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    // 显示确认对话框
                    if (confirm('确定要退出登录吗？')) {
                        // 清除登录状态
                        localStorage.removeItem('userLoggedIn');
                        localStorage.removeItem('currentUsername');
                        
                        // 重定向到登录页
                        window.location.href = '../../login.html';
                    }
                });
            }
            
            // 为岗位卡片添加点击事件（可根据需要扩展）
            const positionCards = document.querySelectorAll('.position-card');
            positionCards.forEach(card => {
                card.addEventListener('click', function() {
                    // 这里可以添加跳转逻辑
                    console.log('点击了岗位:', this.querySelector('.position-name').textContent);
                });
            });
            
            // 导航已通过loadNavigation统一加载
            
            // 确保导航停留在营销获客部位置且选题策划岗不展开
            setTimeout(function() {
                // 查找营销获客部相关的导航项（使用原生JavaScript）
                const sidebarLinks = document.querySelectorAll('.sidebar a');
                sidebarLinks.forEach(link => {
                    if (link.getAttribute('href') && link.getAttribute('href').includes('marketing') || 
                        link.textContent && link.textContent.includes('营销获客部')) {
                        link.classList.add('active');
                    }
                });
                
                // 确保选题策划岗不展开
                const sidebarLinks2 = document.querySelectorAll('.sidebar a');
                sidebarLinks2.forEach(item => {
                    // 查找包含"选题策划岗"文本的链接或href包含"topic"的链接
                    if ((item.textContent && item.textContent.includes('选题策划岗')) || 
                        (item.getAttribute('href') && item.getAttribute('href').includes('topic'))) {
                        item.classList.remove('active');
                        const parentLi = item.closest('li');
                        if (parentLi) {
                            parentLi.classList.remove('expanded', 'open');
                            const subMenu = parentLi.querySelector('.sub-menu, ul');
                            if (subMenu) {
                                subMenu.style.display = 'none';
                            }
                        }
                    }
                });
            }, 200);
        });
    </script>

</body>
</html>
